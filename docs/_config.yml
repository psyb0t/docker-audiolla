title: audiolla
tagline: Self-hosted audio production API
description: audiolla is a self-hosted Docker image that puts stem separation, mastering, analysis, restoration, speech tools, MIDI and music generation behind one REST and MCP API.
lang: en
url: https://psyb0t.github.io
baseurl: /docker-audiolla
repository: psyb0t/docker-audiolla
author: psyb0t

remote_theme: just-the-docs/just-the-docs@v0.12.0
color_scheme: mocha

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-relative-links
  - jekyll-include-cache

permalink: pretty

relative_links:
  enabled: true
  collections: false

defaults:
  - scope:
      path: ""
    values:
      layout: default
      seo:
        type: TechArticle

search:
  heading_level: 3

aux_links:
  GitHub:
    - https://github.com/psyb0t/docker-audiolla
aux_links_new_tab: true

nav_external_links:
  - title: Changelog
    url: https://github.com/psyb0t/docker-audiolla/blob/main/CHANGELOG.md

gh_edit_link: true
gh_edit_link_text: Edit this page on GitHub
gh_edit_repository: https://github.com/psyb0t/docker-audiolla
gh_edit_branch: main
gh_edit_source: docs
gh_edit_view_mode: tree
