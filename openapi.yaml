openapi: "3.1.0"

info:
  title: audiolla
  version: "0.3.0"
  description: |
    Self-hosted music-production REST + MCP API. Stem separation,
    mastering, MIR analysis, DSP transforms, loudness normalization,
    generic pedalboard effects chains, MIDI composition and rendering.
    OpenAPI 3.1-spec'd, FastAPI server, generated Pydantic models.

    The MCP endpoint at /v1/mcp is JSON-RPC over a streamable HTTP
    transport and is NOT described in this document — use an MCP client.

    ## License note
    matchering and pedalboard are GPL v3 — fine for self-hosted use.
    Distributing the Docker image as a product requires GPL compliance
    review.

servers:
  - url: http://localhost:8000

security:
  - BearerAuth: []

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer

  schemas:
    ErrorBody:
      type: object
      required: [detail]
      properties:
        detail:
          type: string
          description: Human-readable error description.

    AudioBlob:
      type: string
      format: binary
      description: Raw audio bytes in the requested output format.

    StagedOutputResponse:
      type: object
      description: Returned when `output_path` is set on an audio-producing endpoint — bytes were written under FILES_DIR / path instead of streamed inline.
      required: [path, size]
      properties:
        path:
          type: string
          description: Relative path under the staging area (resolves to FILES_DIR / path on disk).
        size:
          type: integer
          description: Bytes written.
        output_format:
          type: string
          description: Echo of the requested output_format.

    UrlOutputResponse:
      type: object
      description: Returned when `output_url` is set on an audio-producing endpoint — bytes were PUT to the URL instead of streamed inline.
      required: [url, size]
      properties:
        url:
          type: string
          format: uri
          description: The presigned PUT URL the bytes were uploaded to.
        size:
          type: integer
          description: Bytes uploaded.
        output_format:
          type: string
          description: Echo of the requested output_format.

    EngineInfo:
      type: object
      required: [slug, executor]
      properties:
        slug:
          type: string
          description: Unique engine identifier (key in engines.json).
        executor:
          type: string
          description: Backend type (demucs, matchering, pedalboard_chain, librosa_analyze, sox_transform).
        variant:
          type: string
          nullable: true
          description: Demucs model variant (htdemucs, htdemucs_ft, etc.). Null for non-demucs engines.
        stems:
          type: array
          items:
            type: string
          description: Available stem names. Populated for demucs engines only.
        presets:
          type: array
          items:
            type: string
          description: Available preset names. Populated for pedalboard-chain only.
        description:
          type: string

    AnalyzeResult:
      type: object
      properties:
        bpm:
          type: number
          nullable: true
          description: Estimated tempo in beats per minute.
        key:
          type: string
          nullable: true
          description: Estimated musical key (e.g. "C major", "A minor").
        loudness_lufs:
          type: number
          nullable: true
          description: Integrated loudness in LUFS (ITU-R BS.1770-4).
        duration:
          type: number
          nullable: true
          description: Duration in seconds.
        spectral_centroid:
          type: number
          nullable: true
          description: Mean spectral centroid in Hz.
        rms:
          type: number
          nullable: true
          description: Root mean square energy.
        zcr:
          type: number
          nullable: true
          description: Mean zero-crossing rate.

    LoudnessResult:
      type: object
      required: [loudness_lufs]
      properties:
        loudness_lufs:
          type: number
          description: Measured integrated loudness in LUFS.
        target_lufs:
          type: number
          nullable: true
          description: The requested target_lufs (echoed back). Null if analyze-only.
        normalized:
          type: boolean
          description: True if normalization was applied, false for analyze-only.

    SoxOperation:
      type: object
      required: [op]
      properties:
        op:
          type: string
          enum: [gain, equalizer, compand, reverb, pitch, tempo, rate, channels, trim, pad]
          description: SoX effect name.
        params:
          type: object
          additionalProperties: true
          description: Effect-specific parameters. See SoX documentation for each effect's options.

    HealthResponse:
      type: object
      required: [ok, device, engines]
      properties:
        ok:
          type: boolean
        device:
          type: string
          description: Active compute device (cpu, cuda, cuda:N).
        engines:
          type: array
          items:
            type: string
          description: Configured engine slugs.

    PsEntry:
      type: object
      required: [slug, executor, loaded]
      properties:
        slug:
          type: string
        executor:
          type: string
        loaded:
          type: boolean
        idle_seconds:
          type: number
          nullable: true

  responses:
    400:
      description: Bad request — invalid input or missing required field.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    401:
      description: Missing or invalid bearer token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    404:
      description: Engine or file not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    413:
      description: Upload too large.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    415:
      description: Unsupported media type or output format.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    422:
      description: Validation error — schema mismatch in request body or query params.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    500:
      description: Internal server error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"

paths:
  /healthz:
    get:
      summary: Liveness check
      description: Always unauthenticated. Used by k8s / Docker probes.
      operationId: healthz
      security: []
      responses:
        "200":
          description: Service is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /v1/engines:
    get:
      summary: List configured engines
      description: Returns all engines defined in engines.json with their capabilities.
      operationId: listEngines
      responses:
        "200":
          description: Engine list.
          content:
            application/json:
              schema:
                type: object
                required: [object, data]
                properties:
                  object:
                    type: string
                    enum: [list]
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/EngineInfo"
        "401":
          $ref: "#/components/responses/401"

  /api/ps:
    get:
      summary: List currently loaded engines
      description: Returns engines that have model weights resident in memory.
      operationId: listLoaded
      responses:
        "200":
          description: Loaded engines.
          content:
            application/json:
              schema:
                type: object
                required: [engines]
                properties:
                  engines:
                    type: array
                    items:
                      $ref: "#/components/schemas/PsEntry"
        "401":
          $ref: "#/components/responses/401"

  /api/ps/{engine}:
    delete:
      summary: Evict one engine from memory
      operationId: unloadOne
      parameters:
        - in: path
          name: engine
          required: true
          schema:
            type: string
          description: Engine slug (URL-encoded).
      responses:
        "200":
          description: Engine evicted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  unloaded:
                    type: string
        "401":
          $ref: "#/components/responses/401"
        "404":
          $ref: "#/components/responses/404"

  /unload:
    post:
      summary: Evict all loaded engines
      operationId: unloadAll
      responses:
        "200":
          description: All engines evicted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  unloaded:
                    type: array
                    items:
                      type: string
        "401":
          $ref: "#/components/responses/401"

  /v1/audio/separate:
    post:
      summary: Stem separation
      description: |
        Separate an audio file into individual stems using Demucs.

        Input — exactly one of `file`, `file_path`, or `file_url` (zero or
        more-than-one returns 400). `file_url` is subject to the
        AUDIOLLA_FETCH_MODE allowlist/denylist policy.

        Output — by default the response is raw bytes:
          - single stem requested → audio bytes (Content-Disposition: attachment)
          - multiple stems → ZIP archive

        Pass `output_path` to write the bytes to FILES_DIR / path instead
        (response becomes JSON), or `output_url` to PUT to a presigned URL.
        Exactly one of `output_path` / `output_url` is allowed; supply
        neither for the default inline response.
      operationId: separate
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [engine]
              properties:
                file:
                  type: string
                  format: binary
                  description: Audio file to separate (multipart upload). Mutually exclusive with file_path / file_url.
                file_path:
                  type: string
                  description: Path under the staging area (`/v1/files/...`). Mutually exclusive with file / file_url.
                file_url:
                  type: string
                  format: uri
                  description: Remote URL — server fetches subject to AUDIOLLA_FETCH_MODE policy. Mutually exclusive with file / file_path.
                output_path:
                  type: string
                  description: Optional. Write the output to FILES_DIR / path; response becomes JSON ({path, size, ...}). Mutually exclusive with output_url.
                output_url:
                  type: string
                  format: uri
                  description: Optional. PUT the output to a presigned URL; response becomes JSON ({url, size, ...}). Mutually exclusive with output_path.
                engine:
                  type: string
                  description: Engine slug (must have executor=demucs).
                stems:
                  type: array
                  items:
                    type: string
                  description: Stem names to include in output. Defaults to all stems for the variant.
                output_format:
                  type: string
                  default: wav
                  enum: [wav, mp3, flac, opus, aac, pcm]
      responses:
        "200":
          description: |
            Audio bytes (single stem), ZIP archive (multiple stems), or
            JSON descriptor when output_path / output_url is set.
          content:
            audio/wav:
              schema:
                $ref: "#/components/schemas/AudioBlob"
            audio/mpeg:
              schema:
                $ref: "#/components/schemas/AudioBlob"
            audio/flac:
              schema:
                $ref: "#/components/schemas/AudioBlob"
            application/zip:
              schema:
                $ref: "#/components/schemas/AudioBlob"
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/StagedOutputResponse"
                  - $ref: "#/components/schemas/UrlOutputResponse"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "404":
          $ref: "#/components/responses/404"
        "413":
          $ref: "#/components/responses/413"
        "415":
          $ref: "#/components/responses/415"
        "422":
          $ref: "#/components/responses/422"
        "500":
          $ref: "#/components/responses/500"

  /v1/audio/master:
    post:
      summary: Audio mastering
      description: |
        Master an audio file. Two modes:
        - `reference`: match loudness, EQ, and dynamics to a reference track (matchering).
        - `chain`: apply a named pedalboard preset (EQ → compress → limit → LUFS normalize).

        Input — exactly one of `file`, `file_path`, or `file_url`. When
        `mode=reference`, also provide exactly one of `reference`,
        `reference_path`, or `reference_url`.

        Output — same input/output mode rules as /v1/audio/separate.

        `target_lufs` adjusts final integrated loudness in both modes. If omitted, matchering
        targets the reference file's loudness; chain presets use their own built-in target.
      operationId: master
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [mode]
              properties:
                file:
                  type: string
                  format: binary
                  description: Audio file to master. Mutually exclusive with file_path / file_url.
                file_path:
                  type: string
                  description: Path under the staging area. Mutually exclusive with file / file_url.
                file_url:
                  type: string
                  format: uri
                  description: Remote URL (subject to AUDIOLLA_FETCH_MODE policy). Mutually exclusive with file / file_path.
                output_path:
                  type: string
                  description: Optional. Write the mastered audio to FILES_DIR / path; JSON response.
                output_url:
                  type: string
                  format: uri
                  description: Optional. PUT the mastered audio to a presigned URL; JSON response.
                mode:
                  type: string
                  enum: [reference, chain]
                reference:
                  type: string
                  format: binary
                  description: "Reference audio file (multipart). When mode=reference, provide one of reference / reference_path / reference_url."
                reference_path:
                  type: string
                  description: Reference file path under staging. Mode=reference only.
                reference_url:
                  type: string
                  format: uri
                  description: Reference file remote URL (fetch policy applies). Mode=reference only.
                preset:
                  type: string
                  description: Pedalboard preset name. Required when mode=chain.
                target_lufs:
                  type: number
                  description: Target integrated loudness in LUFS. Optional.
                output_format:
                  type: string
                  default: wav
                  enum: [wav, mp3, flac, opus, aac, pcm]
      responses:
        "200":
          description: Mastered audio bytes (or JSON descriptor with output_path / output_url).
          content:
            audio/wav:
              schema:
                $ref: "#/components/schemas/AudioBlob"
            audio/mpeg:
              schema:
                $ref: "#/components/schemas/AudioBlob"
            audio/flac:
              schema:
                $ref: "#/components/schemas/AudioBlob"
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/StagedOutputResponse"
                  - $ref: "#/components/schemas/UrlOutputResponse"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "404":
          $ref: "#/components/responses/404"
        "413":
          $ref: "#/components/responses/413"
        "415":
          $ref: "#/components/responses/415"
        "422":
          $ref: "#/components/responses/422"
        "500":
          $ref: "#/components/responses/500"

  /v1/audio/analyze:
    post:
      summary: MIR analysis
      description: |
        Extract music information retrieval features from an audio file using librosa.
        Specify `features` to limit which are computed; omit to compute all.

        Input — exactly one of `file`, `file_path`, or `file_url`. Output
        is always JSON (no output_path / output_url here — the body is
        already structured data).
      operationId: analyze
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: Audio file (multipart). Mutually exclusive with file_path / file_url.
                file_path:
                  type: string
                  description: Path under the staging area. Mutually exclusive with file / file_url.
                file_url:
                  type: string
                  format: uri
                  description: Remote URL (fetch policy applies). Mutually exclusive with file / file_path.
                features:
                  type: array
                  items:
                    type: string
                    enum: [bpm, key, loudness, duration, spectral_centroid, rms, zcr]
                  description: Feature subset to compute. Defaults to all.
      responses:
        "200":
          description: Analysis results.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyzeResult"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "413":
          $ref: "#/components/responses/413"
        "422":
          $ref: "#/components/responses/422"
        "500":
          $ref: "#/components/responses/500"

  /v1/audio/transform:
    post:
      summary: DSP transform chain
      description: |
        Apply a sequence of SoX effects to an audio file.
        `operations` is an ordered array of `{op, params}` objects; each op is a
        SoX effect name and params are passed directly to pysox. The chain is applied
        in order — output of each effect feeds the next.

        Input/output mode rules same as /v1/audio/separate.
      operationId: transform
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [operations]
              properties:
                file:
                  type: string
                  format: binary
                  description: Audio file (multipart). Mutually exclusive with file_path / file_url.
                file_path:
                  type: string
                  description: Path under the staging area. Mutually exclusive with file / file_url.
                file_url:
                  type: string
                  format: uri
                  description: Remote URL (fetch policy applies). Mutually exclusive with file / file_path.
                output_path:
                  type: string
                  description: Optional. Write the transformed audio to FILES_DIR / path; JSON response.
                output_url:
                  type: string
                  format: uri
                  description: Optional. PUT the transformed audio to a presigned URL; JSON response.
                operations:
                  type: string
                  description: JSON-encoded array of SoxOperation objects.
                output_format:
                  type: string
                  default: wav
                  enum: [wav, mp3, flac, opus, aac, pcm]
      responses:
        "200":
          description: Transformed audio bytes (or JSON descriptor with output_path / output_url).
          content:
            audio/wav:
              schema:
                $ref: "#/components/schemas/AudioBlob"
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/StagedOutputResponse"
                  - $ref: "#/components/schemas/UrlOutputResponse"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "413":
          $ref: "#/components/responses/413"
        "422":
          $ref: "#/components/responses/422"
        "500":
          $ref: "#/components/responses/500"

  /v1/audio/loudness:
    post:
      summary: Loudness measurement and normalization
      description: |
        Measure integrated loudness (LUFS) of an audio file.
        If `target_lufs` is supplied, normalize the file to that target and return
        audio bytes. If omitted, return a JSON analysis result only.

        Input — exactly one of `file`, `file_path`, or `file_url`.
        `output_path` / `output_url` apply only when target_lufs is set
        (measurement-only is already JSON).
      operationId: loudness
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: Audio file (multipart). Mutually exclusive with file_path / file_url.
                file_path:
                  type: string
                  description: Path under the staging area. Mutually exclusive with file / file_url.
                file_url:
                  type: string
                  format: uri
                  description: Remote URL (fetch policy applies). Mutually exclusive with file / file_path.
                output_path:
                  type: string
                  description: Optional. Write the normalized audio to FILES_DIR / path; JSON response. Ignored when target_lufs is omitted.
                output_url:
                  type: string
                  format: uri
                  description: Optional. PUT the normalized audio to a presigned URL; JSON response. Ignored when target_lufs is omitted.
                target_lufs:
                  type: number
                  description: Target integrated loudness in LUFS. Omit to analyze only.
                output_format:
                  type: string
                  default: wav
                  enum: [wav, mp3, flac, opus, aac, pcm]
                  description: Output format. Only used when target_lufs is supplied.
      responses:
        "200":
          description: |
            JSON loudness result (analyze-only or output_path / output_url
            mode) or audio bytes (when target_lufs supplied without
            output_path / output_url).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/LoudnessResult"
                  - $ref: "#/components/schemas/StagedOutputResponse"
                  - $ref: "#/components/schemas/UrlOutputResponse"
            audio/wav:
              schema:
                $ref: "#/components/schemas/AudioBlob"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "413":
          $ref: "#/components/responses/413"
        "422":
          $ref: "#/components/responses/422"
        "500":
          $ref: "#/components/responses/500"

  /v1/audio/fx:
    post:
      summary: Generic effects chain (full pedalboard catalog)
      description: |
        Apply an ordered chain of effects to an audio file. Each entry
        in `effects` is a `{type, params}` object — `type` is a
        pedalboard class name (Compressor, Limiter, Gain, Reverb,
        Chorus, Delay, Phaser, Distortion, Bitcrush, PitchShift,
        HighShelfFilter, LowShelfFilter, PeakFilter, HighpassFilter,
        LowpassFilter, LadderFilter, IIRFilter, NoiseGate, Clipping,
        Convolution, GSMFullRateCompressor, MP3Compressor, Resample,
        Invert). Effect-loading classes (VST3Plugin, AudioUnitPlugin,
        ExternalPlugin) are rejected — they load arbitrary native code.

        Input/output mode rules same as /v1/audio/separate.
      operationId: fx
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [effects]
              properties:
                file:
                  type: string
                  format: binary
                  description: Audio file (multipart). Mutually exclusive with file_path / file_url.
                file_path:
                  type: string
                  description: Path under the staging area. Mutually exclusive with file / file_url.
                file_url:
                  type: string
                  format: uri
                  description: Remote URL (fetch policy applies). Mutually exclusive with file / file_path.
                output_path:
                  type: string
                  description: Optional. Write the processed audio to FILES_DIR / path; JSON response.
                output_url:
                  type: string
                  format: uri
                  description: Optional. PUT the processed audio to a presigned URL; JSON response.
                effects:
                  type: string
                  description: JSON-encoded array of {type, params} objects.
                output_format:
                  type: string
                  default: wav
                  enum: [wav, mp3, flac, opus, aac, pcm]
      responses:
        "200":
          description: Processed audio bytes (or JSON descriptor with output_path / output_url).
          content:
            audio/wav:
              schema:
                $ref: "#/components/schemas/AudioBlob"
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/StagedOutputResponse"
                  - $ref: "#/components/schemas/UrlOutputResponse"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "404":
          $ref: "#/components/responses/404"
        "413":
          $ref: "#/components/responses/413"
        "415":
          $ref: "#/components/responses/415"
        "500":
          $ref: "#/components/responses/500"

  /v1/midi/compose:
    post:
      summary: JSON spec → MIDI bytes
      description: |
        Transcode a song spec to a Standard MIDI File. Body is
        application/json with the shape:

        ```
        {
          "tempo_bpm": 120,
          "time_signature": [4, 4],
          "key_signature": "C",
          "ticks_per_beat": 480,
          "tracks": [
            {
              "name": "Lead",
              "program": 0,
              "channel": 0,
              "volume": 100,
              "pan": 64,
              "notes": [
                {"pitch": 60, "start_beats": 0.0, "duration_beats": 0.5, "velocity": 100}
              ]
            }
          ]
        }
        ```

        Time is in beats; the engine converts to ticks. Channel 9 (zero-indexed) is the GM drum channel.

        Pass `output_path` or `output_url` as query parameters to write
        the MIDI to staging or PUT it to a presigned URL respectively.
        Default returns raw MIDI bytes (Content-Type: audio/midi).
      operationId: midiCompose
      parameters:
        - in: query
          name: output_path
          schema:
            type: string
          required: false
          description: Optional. Stage the resulting MIDI at this path under FILES_DIR; JSON response.
        - in: query
          name: output_url
          schema:
            type: string
            format: uri
          required: false
          description: Optional. PUT the resulting MIDI to a presigned URL; JSON response.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Song spec — see the description for the full shape.
      responses:
        "200":
          description: |
            Raw MIDI bytes (default), or JSON descriptor with output_path / output_url.
          content:
            audio/midi:
              schema:
                type: string
                format: binary
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/StagedOutputResponse"
                  - $ref: "#/components/schemas/UrlOutputResponse"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "404":
          $ref: "#/components/responses/404"
        "500":
          $ref: "#/components/responses/500"

  /v1/midi/render:
    post:
      summary: MIDI → audio via fluidsynth + SoundFont
      description: |
        Synthesise a MIDI file to audio. By default uses the prod image's
        bundled FluidR3_GM SoundFont (MIT, ships via fluid-soundfont-gm).
        Override per request with `soundfont_path` pointing at a staged
        `.sf2` file, or globally via the `AUDIOLLA_SOUNDFONT` env var.

        Input/output mode rules same as /v1/audio/separate.
      operationId: midiRender
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: MIDI file (multipart). Mutually exclusive with file_path / file_url.
                file_path:
                  type: string
                  description: Path under the staging area. Mutually exclusive with file / file_url.
                file_url:
                  type: string
                  format: uri
                  description: Remote URL (fetch policy applies). Mutually exclusive with file / file_path.
                output_path:
                  type: string
                  description: Optional. Stage the rendered audio at this path.
                output_url:
                  type: string
                  format: uri
                  description: Optional. PUT the rendered audio to a presigned URL.
                soundfont_path:
                  type: string
                  description: Optional. Path to a staged .sf2 SoundFont under FILES_DIR. Defaults to AUDIOLLA_SOUNDFONT.
                gain:
                  type: number
                  default: 0.5
                  description: fluidsynth output gain in [0.0, 5.0]. The default (0.5) is calibrated to not clip on percussive MIDI.
                samplerate:
                  type: integer
                  default: 44100
                  enum: [22050, 44100, 48000, 88200, 96000]
                output_format:
                  type: string
                  default: wav
                  enum: [wav, mp3, flac, opus, aac, pcm]
      responses:
        "200":
          description: Rendered audio bytes (or JSON descriptor with output_path / output_url).
          content:
            audio/wav:
              schema:
                $ref: "#/components/schemas/AudioBlob"
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/StagedOutputResponse"
                  - $ref: "#/components/schemas/UrlOutputResponse"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "404":
          $ref: "#/components/responses/404"
        "413":
          $ref: "#/components/responses/413"
        "415":
          $ref: "#/components/responses/415"
        "500":
          $ref: "#/components/responses/500"

  /v1/midi/generate:
    post:
      summary: Compose + render — JSON spec → audio bytes in one call
      description: |
        Convenience wrapper around /v1/midi/compose + /v1/midi/render.
        Body is the same song spec as /v1/midi/compose. Audio rendering
        knobs are passed as query parameters.
      operationId: midiGenerate
      parameters:
        - in: query
          name: output_format
          schema:
            type: string
            default: wav
            enum: [wav, mp3, flac, opus, aac, pcm]
        - in: query
          name: soundfont_path
          schema:
            type: string
        - in: query
          name: gain
          schema:
            type: number
            default: 0.5
        - in: query
          name: samplerate
          schema:
            type: integer
            default: 44100
            enum: [22050, 44100, 48000, 88200, 96000]
        - in: query
          name: output_path
          schema:
            type: string
        - in: query
          name: output_url
          schema:
            type: string
            format: uri
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Song spec — same shape as /v1/midi/compose.
      responses:
        "200":
          description: Generated audio bytes (or JSON descriptor).
          content:
            audio/wav:
              schema:
                $ref: "#/components/schemas/AudioBlob"
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/StagedOutputResponse"
                  - $ref: "#/components/schemas/UrlOutputResponse"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "404":
          $ref: "#/components/responses/404"
        "415":
          $ref: "#/components/responses/415"
        "500":
          $ref: "#/components/responses/500"

  /v1/files:
    get:
      summary: List staged files
      description: List all files currently in the server-side staging area.
      operationId: filesList
      responses:
        "200":
          description: File listing.
          content:
            application/json:
              schema:
                type: object
                properties:
                  files:
                    type: array
                    items:
                      type: object
                      properties:
                        path:
                          type: string
                        size:
                          type: integer
                        modified:
                          type: string
                          format: date-time
        "401":
          $ref: "#/components/responses/401"

  /v1/files/{path}:
    put:
      summary: Stage a file
      description: Upload a file to the server-side staging area at the given path.
      operationId: filesPut
      parameters:
        - in: path
          name: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: File staged.
          content:
            application/json:
              schema:
                type: object
                properties:
                  path:
                    type: string
                  size:
                    type: integer
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "413":
          $ref: "#/components/responses/413"

    get:
      summary: Retrieve a staged file
      operationId: filesGet
      parameters:
        - in: path
          name: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: File bytes.
          content:
            application/octet-stream:
              schema:
                $ref: "#/components/schemas/AudioBlob"
        "401":
          $ref: "#/components/responses/401"
        "404":
          $ref: "#/components/responses/404"

    delete:
      summary: Delete a staged file
      operationId: filesDelete
      parameters:
        - in: path
          name: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: File deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: string
        "401":
          $ref: "#/components/responses/401"
        "404":
          $ref: "#/components/responses/404"
        "500":
          $ref: "#/components/responses/500"
