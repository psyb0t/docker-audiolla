    get:
      tags: ["Workflow"]
      summary: Describe a single preset
      operationId: describePreset
      parameters:
        - in: path
          name: name
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Preset description.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "401": { $ref: "#/components/responses/401" }
        "404": { $ref: "#/components/responses/404" }
    post:
      tags: ["Workflow"]
      summary: Run a named preset
      operationId: runPreset
      parameters:
        - in: path
          name: name
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PresetRunRequest" }
      responses:
        "200":
          description: Preset executed.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/StagedOutputResponse"
                  - $ref: "#/components/schemas/UrlOutputResponse"
        "202":
