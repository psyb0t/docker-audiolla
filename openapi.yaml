openapi: "3.1.0"

info:
  title: audiolla
  version: "1.0.0"
  description: |
    Self-hosted audio-production REST + MCP API. Stem separation,
    restoration, mastering, MIR analysis, DSP transforms, loudness,
    speech enhancement, voice activity detection, speaker diarization,
    MIDI transcription + composition, text-to-music + text-to-SFX
    generation, curated workflow presets, ad-hoc op pipelines.

    The MCP endpoint at /v1/mcp is JSON-RPC over a streamable HTTP
    transport and is NOT described in this document — use an MCP client.

    ## API contract (v1.0.0 — breaking changes from v0.23.x)

    Every audio endpoint takes a JSON body. Multipart upload is supported
    only on `PUT /v1/files/{path}` — the local-staging interface.

    **Input** — exactly one of:
      - `file_path` (FILES_DIR-relative, server reads from local /v1/files
        staging area)
      - `file_url` (any HTTP/HTTPS URL the server fetches; works with
        AWS Sig V4 presigned GETs, plain HTTP, hybrids3 buckets, etc.)

    **Output** — exactly one of:
      - `output_path` (server writes to FILES_DIR/<path>, response JSON is
        `{path, size, ...}`; caller downloads via `GET /v1/files/<path>`)
      - `output_url` (server PUTs to the URL — must be a presigned PUT URL
        for AWS Sig V4 services or a plain PUT-accepting endpoint;
        response JSON is `{url, size, ...}`)

    `async_job=true` auto-stages to `jobs/{id}.{ext}` under FILES_DIR if
    neither output is given.

servers:
  - url: http://localhost:8000

security:
  - BearerAuth: []

tags:
  - name: Health
    description: Liveness probes and discovery.
  - name: Engines
    description: List, inspect, evict registered engines.
  - name: Files
    description: Local staging area — upload, download, delete files referenced by other endpoints.
  - name: Jobs
    description: Async-job queue — submit, poll, cancel long-running operations.
  - name: Audio Analysis
    description: Audio → JSON. BPM / key / chords / loudness / beats / fingerprint / chroma / VAD / silence / classify / similarity / metadata / info / clip detection.
  - name: Audio Transform
    description: Audio → audio. DSP transforms — normalize, EQ, fade, trim, reverse, speed, stretch, pitch correct, loop, pan, FX, sox chains.
  - name: Audio Restoration
    description: Audio → audio. Noise reduction, de-essing, multiband compression, dynamics, repair, conv reverb.
  - name: Audio Separation
    description: Stem separation, harmonic/percussive split, vocal isolation, restoration via UVR / Demucs.
  - name: Audio Mixing
    description: Multi-file → audio. Concat, mix, remix, BPM/key match, DJ prep, batch.
  - name: Audio Generation
    description: Text → audio. Stable Audio Open, MusicGen, Riffusion, AudioLDM 2.
  - name: Audio Visualization
    description: Audio → image/video. Spectrogram, waveform, animated visualizers.
  - name: MIDI
    description: MIDI composition, rendering, transformation, audio→MIDI transcription.
  - name: Workflow
    description: Presets, ad-hoc pipelines, named workflows.


components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer

  parameters:
    EnginePath:
      in: path
      name: engine
      required: true
      schema:
        type: string
      description: Engine slug (e.g. `htdemucs`, `uvr-vocal-bsr`, `basic-pitch`).
    ModePath:
      in: path
      name: mode
      required: true
      schema:
        type: string
      description: Endpoint-specific mode token (e.g. `encode`/`decode` for mid-side).
    FilesPath:
      in: path
      name: path
      required: true
      schema:
        type: string
      description: FILES_DIR-relative path (slashes allowed).
    JobIdPath:
      in: path
      name: job_id
      required: true
      schema:
        type: string
      description: UUID of an async job.

  responses:
    "400":
      description: Bad request — invalid input or constraint violation.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    "401":
      description: Missing or invalid bearer token.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    "404":
      description: Engine or file not found.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    "413":
      description: Payload too large.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    "415":
      description: Unsupported output format / media type.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    "422":
      description: Validation error — request body schema mismatch.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    "500":
      description: Internal server error.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }

  schemas:
    ErrorBody:
      type: object
      required: [detail]
      properties:
        detail: { type: string }

    OutputFormat:
      type: string
      enum: [wav, mp3, flac, opus, aac, pcm]

    AudioBlob:
      type: string
      format: binary

    BaseAudioInputRequest:
      type: object
      description: |
        Single-file audio input. Provide exactly one of `file_path` or
        `file_url`. Mutually exclusive, validated server-side.
      properties:
        file_path:
          type: string
          nullable: true
          description: FILES_DIR-relative path (pre-staged via PUT /v1/files/{path}).
        file_url:
          type: string
          format: uri
          nullable: true
          description: HTTP/HTTPS URL the server fetches (subject to AUDIOLLA_FETCH_MODE).

    MultiAudioInputRequest:
      type: object
      description: |
        Multi-file audio input. Provide exactly one of `file_paths` or `file_urls`.
      properties:
        file_paths:
          type: array
          items: { type: string }
          minItems: 1
          nullable: true
        file_urls:
          type: array
          items: { type: string, format: uri }
          minItems: 1
          nullable: true

    BaseAudioOutputRequest:
      type: object
      description: |
        Audio-producing endpoint output. Provide exactly one of `output_path` or
        `output_url`. async_job=true auto-stages to jobs/{id}.{ext} if neither.
      properties:
        output_format:
          $ref: "#/components/schemas/OutputFormat"
          default: wav
        output_path:
          type: string
          nullable: true
          description: FILES_DIR-relative path; response is JSON {path, size, ...}.
        output_url:
          type: string
          format: uri
          nullable: true
          description: Presigned PUT URL (S3, hybrids3, MinIO, R2, etc.) — response is JSON {url, size, ...}.
        async_job:
          type: boolean
          default: false
        webhook_url:
          type: string
          format: uri
          nullable: true

    BaseGenerateRequest:
      type: object
      required: [prompt]
      properties:
        prompt: { type: string, minLength: 1 }
        duration_sec:
          type: number
          minimum: 0.001
          default: 10.0
        seed: { type: integer, nullable: true }

    StagedOutputResponse:
      type: object
      required: [path, size]
      properties:
        path: { type: string }
        size: { type: integer }
        output_format: { type: string, nullable: true }

    UrlOutputResponse:
      type: object
      required: [url, size]
      properties:
        url: { type: string, format: uri }
        size: { type: integer }
        output_format: { type: string, nullable: true }

    JobAcceptedResponse:
      type: object
      required: [job_id, status_url]
      properties:
        job_id: { type: string }
        status_url: { type: string, format: uri }

    NormalizeResponse:
      allOf:
        - $ref: "#/components/schemas/StagedOutputResponse"
        - type: object
          properties:
            target_lufs: { type: number, nullable: true }
            measured_lufs: { type: number, nullable: true }

    AnalyzeResult:
      type: object
      properties:
        bpm: { type: number, nullable: true }
        key: { type: string, nullable: true }
        loudness_lufs: { type: number, nullable: true }
        duration: { type: number, nullable: true }
        spectral_centroid: { type: number, nullable: true }
        rms: { type: number, nullable: true }
        zcr: { type: number, nullable: true }

    LoudnessResult:
      type: object
      required: [loudness_lufs]
      properties:
        loudness_lufs: { type: number }
        target_lufs: { type: number, nullable: true }
        normalized: { type: boolean }

    HealthResponse:
      type: object
      required: [ok, device, engines]
      properties:
        ok: { type: boolean }
        device: { type: string }
        engines:
          type: array
          items: { type: string }

    EngineInfo:
      type: object
      required: [slug, executor]
      properties:
        slug: { type: string }
        executor: { type: string }
        variant: { type: string, nullable: true }
        stems:
          type: array
          items: { type: string }
        presets:
          type: array
          items: { type: string }
        loaded: { type: boolean, nullable: true }
        idle_seconds: { type: number, nullable: true }
        description: { type: string, nullable: true }

    # ── per-endpoint request schemas (generated from server handler signatures) ──
    AudioSeparateRequest:
      allOf:
        - $ref: "#/components/schemas/BaseAudioInputRequest"
        - $ref: "#/components/schemas/BaseAudioOutputRequest"
        - type: object
          required: [engine]
          properties:
            engine:
              type: string
              default: htdemucs
              description: |
                Stem-separation engine slug. Demucs (`htdemucs`,
                `htdemucs_ft`, `mdx_extra`) or UVR variant
                (`uvr-vocal-bsr`, `uvr-karaoke`, `uvr-dereverb`, etc.).
            stems:
              type: array
              items:
                type: string
              default: []
              description: Subset of stems to return. Empty = all available stems.

    PresetRunRequest:
      type: object
      description: |
        Body for ``POST /v1/presets/{name}``. The preset's steps are
        baked into the server-side preset definition; the request only
        specifies the input + output destination and optional per-step
        param overrides.
      properties:
        file_path: { type: string, nullable: true }
        file_url: { type: string, format: uri, nullable: true }
        output_path: { type: string, nullable: true }
        output_url: { type: string, format: uri, nullable: true }
        output_format: { $ref: "#/components/schemas/OutputFormat" }
        async_job: { type: boolean, default: false }
        webhook_url: { type: string, format: uri, nullable: true }
        params:
          type: object
          additionalProperties: true
          nullable: true
          description: Override values for parameters the preset declares.

    PipelineRunRequest:
      type: object
      required: [steps]
      description: |
        Body for ``POST /v1/pipeline``. Apply N transforms in order to
        one input. Intermediates stay in memory between steps — no
        re-upload required.
      properties:
        file_path: { type: string, nullable: true }
        file_url: { type: string, format: uri, nullable: true }
        steps:
          type: array
          items:
            type: object
            required: [op]
            properties:
              op: { type: string }
              params:
                type: object
                additionalProperties: true
        output_path: { type: string, nullable: true }
        output_url: { type: string, format: uri, nullable: true }
        output_format: { $ref: "#/components/schemas/OutputFormat" }
        async_job: { type: boolean, default: false }
        webhook_url: { type: string, format: uri, nullable: true }

    AudioMasterRequest:
      allOf:
        - $ref: "#/components/schemas/BaseAudioInputRequest"
        - $ref: "#/components/schemas/BaseAudioOutputRequest"
        - type: object
          properties:
            mode:
              type: string
              enum: [reference, chain]
              nullable: true
              description: |
                Either `reference` (match against a reference track via
                matchering) or `chain` (run a pedalboard preset chain).
                Optional — auto-detected from the request: if
                reference_path or reference_url is set, mode=reference;
                else if preset is set, mode=chain; else 400.
            reference_path:
              type: string
              nullable: true
            reference_url:
              type: string
              format: uri
              nullable: true
            preset:
              type: string
              nullable: true
              description: |
                For mode=chain, the pedalboard preset to run. Currently
                'transparent' or 'loud'. (Note: this is distinct from the
                workflow presets listed at GET /v1/presets — those are
                multi-step pipelines invoked via POST /v1/presets/{name}.)
            target_lufs:
              type: number
              nullable: true

    AudioAnalyzeRequest:
      allOf:
        - $ref: "#/components/schemas/BaseAudioInputRequest"
        - type: object
          properties:
            features:
              type: array
              items:
                type: string
              default: []

    AudioTransformRequest:
      allOf:
        - $ref: "#/components/schemas/BaseAudioInputRequest"
        - $ref: "#/components/schemas/BaseAudioOutputRequest"
        - type: object
          required: [operations]
          properties:
            operations:
              type: array
              description: SoX effect chain — each entry is {op, params}.
              items:
                type: object
                properties:
                  op: { type: string }
                  params: { type: object, additionalProperties: true }

    AudioLoudnessRequest:
      allOf:
        - $ref: "#/components/schemas/BaseAudioInputRequest"

    AudioNormalizeRequest:
      allOf:
        - $ref: "#/components/schemas/BaseAudioInputRequest"
        - $ref: "#/components/schemas/BaseAudioOutputRequest"
        - type: object
          required: [target_lufs]
          properties:
            target_lufs:
              type: number

    AudioFxRequest:
      allOf:
        - $ref: "#/components/schemas/BaseAudioInputRequest"
        - $ref: "#/components/schemas/BaseAudioOutputRequest"
        - type: object
          required: [effects]
          properties:
            effects:
              type: array
              description: Pedalboard effect chain — each entry is {type, params}.
              items:
                type: object
                properties:
                  type: { type: string }
                  params: { type: object, additionalProperties: true }

    MidiRenderRequest:
      allOf:
        - $ref: "#/components/schemas/BaseAudioInputRequest"
        - $ref: "#/components/schemas/BaseAudioOutputRequest"
        - type: object
          properties:
            soundfont_path:
              type: string
              nullable: true
            gain:
              type: number
              default: 0.5
            samplerate:
              type: integer
              default: 44100

    AudioBeatsRequest:
      allOf:
        - $ref: "#/components/schemas/BaseAudioInputRequest"
        - $ref: "#/components/schemas/BaseAudioOutputRequest"
        - type: object
          properties:
            click_track:
              type: boolean
              default: false
            start_bpm:
              type: number
              nullable: true

    AudioOnsetsRequest:
      allOf:
        - $ref: "#/components/schemas/BaseAudioInputRequest"

    AudioMelodyRequest:
      allOf:
        - $ref: "#/components/schemas/BaseAudioInputRequest"
        - $ref: "#/components/schemas/BaseAudioOutputRequest"
        - type: object
          properties:
            fmin:
              type: number
              default: 65.0
            fmax:
              type: number
              default: 2093.0
            as_midi:
              type: boolean
              default: false

    AudioSegmentsRequest:
      allOf:
        - $ref: "#/components/schemas/BaseAudioInputRequest"
        - type: object
          properties:
            num_segments:
              type: integer
              default: 6

    AudioSilenceRequest:
      allOf:
        - $ref: "#/components/schemas/BaseAudioInputRequest"
        - $ref: "#/components/schemas/BaseAudioOutputRequest"
        - type: object
          properties:
            threshold_db:
              type: number
              default: -30.0
            min_duration_sec:
              type: number
              default: 0.5
            trim_mode:
              type: string
              nullable: true

    AudioVisualizeImageSpectrogramRequest:
      allOf:
        - $ref: "#/components/schemas/BaseAudioInputRequest"
        - $ref: "#/components/schemas/BaseAudioOutputRequest"
        - type: object
          properties:
            width:
              type: integer
              default: 1280
            height:
              type: integer
              default: 720
            color:
              type: string
              default: intensity
            scale:
              type: string
              default: log

    AudioVisualizeImageWaveformRequest:
      allOf:
        - $ref: "#/components/schemas/BaseAudioInputRequest"
        - $ref: "#/components/schemas/BaseAudioOutputRequest"
        - type: object
          properties:
            width:
              type: integer
              default: 1280
            height:
              type: integer
              default: 720
            color:
              type: string
              default: lime

    AudioVisualizeVideoRequest:
      allOf:
        - $ref: "#/components/schemas/BaseAudioInputRequest"
        - $ref: "#/components/schemas/BaseAudioOutputRequest"
        - type: object
          properties:
            width:
              type: integer
              default: 1280
            height:
              type: integer
              default: 720
            fps:
              type: integer
              default: 30
            container:
              type: string
              default: mp4

    AudioFingerprintRequest:
      allOf:
        - $ref: "#/components/schemas/BaseAudioInputRequest"
        - type: object
          properties:
            analyze_seconds:
              type: number
              default: 120.0
            return_raw:
              type: boolean
              default: false

    AudioRestoreRequest:
      allOf:
        - $ref: "#/components/schemas/BaseAudioInputRequest"
        - $ref: "#/components/schemas/BaseAudioOutputRequest"
        - type: object
          properties:
            aggressive:
              type: boolean
              default: false

    MidiInspectRequest:
      allOf:
        - $ref: "#/components/schemas/BaseAudioInputRequest"

    MidiTransformRequest:
      allOf:
        - $ref: "#/components/schemas/BaseAudioInputRequest"
        - $ref: "#/components/schemas/BaseAudioOutputRequest"
        - type: object
          properties:
            transpose_semitones:
              type: integer
              default: 0
            quantize_grid_beats:
              type: number
              nullable: true
            tempo_bpm:
              type: number
              nullable: true
            keep_channels:
              type: string
              nullable: true
            drop_channels:
              type: string
              nullable: true

    AudioToMidiRequest:
      allOf:
        - $ref: "#/components/schemas/BaseAudioInputRequest"
        - $ref: "#/components/schemas/BaseAudioOutputRequest"
        - type: object
          properties:
            onset_threshold:
              type: number
              default: 0.5
            frame_threshold:
              type: number
              default: 0.3
            minimum_note_length_ms:
              type: number
              default: 58.0
            minimum_frequency:
              type: number
              nullable: true
            maximum_frequency:
              type: number
              nullable: true
            multiple_pitch_bends:
              type: boolean
              default: false
            melodia_trick:
              type: boolean
              default: true

    AudioEnhanceRequest:
      allOf:
        - $ref: "#/components/schemas/BaseAudioInputRequest"
        - $ref: "#/components/schemas/BaseAudioOutputRequest"

    AudioChordsRequest:
      allOf:
        - $ref: "#/components/schemas/BaseAudioInputRequest"
        - type: object
          properties:
            hop_length:
              type: integer
              default: 512
            segment_min_duration_sec:
              type: number
              default: 0.5

    AudioVadRequest:
      allOf:
        - $ref: "#/components/schemas/BaseAudioInputRequest"
        - type: object
          properties:
            threshold:
              type: number
              default: 0.5
            min_speech_duration_ms:
              type: number
              default: 250.0
            min_silence_duration_ms:
              type: number
              default: 100.0

    AudioDiarizeRequest:
      allOf:
        - $ref: "#/components/schemas/BaseAudioInputRequest"
        - type: object
          properties:
            num_speakers:
              type: integer
              nullable: true
            min_speakers:
              type: integer
              nullable: true
            max_speakers:
              type: integer
              nullable: true

    AudioStretchRequest:
      allOf:
        - $ref: "#/components/schemas/BaseAudioInputRequest"
        - $ref: "#/components/schemas/BaseAudioOutputRequest"
        - type: object
          properties:
            tempo_factor:
              type: number
              default: 1.0
            pitch_semitones:
              type: number
              default: 0.0

    AudioTagRequest:
      allOf:
        - $ref: "#/components/schemas/BaseAudioInputRequest"
        - type: object
          properties:
            top_k:
              type: integer
              default: 10

    AudioEmbedRequest:
      allOf:
        - $ref: "#/components/schemas/BaseAudioInputRequest"
        - type: object
          properties:
            query_text:
              type: string
              nullable: true

    AudioSeparateHpssRequest:
      allOf:
        - $ref: "#/components/schemas/BaseAudioInputRequest"
        - $ref: "#/components/schemas/BaseAudioOutputRequest"
        - type: object
          properties:
            margin:
              type: number
              default: 1.0
            kernel_size:
              type: integer
              default: 31

    AudioNoiseReduceRequest:
      allOf:
        - $ref: "#/components/schemas/BaseAudioInputRequest"
        - $ref: "#/components/schemas/BaseAudioOutputRequest"
        - type: object
          properties:
            stationary:
              type: boolean
              default: false
            prop_decrease:
              type: number
              default: 1.0

    AudioInfoRequest:
      allOf:
        - $ref: "#/components/schemas/BaseAudioInputRequest"

    AudioTrimRequest:
      allOf:
        - $ref: "#/components/schemas/BaseAudioInputRequest"
        - $ref: "#/components/schemas/BaseAudioOutputRequest"
        - type: object
          properties:
            start_sec:
              type: number
              default: 0.0
              description: "Trim window start in seconds. Defaults to 0 (beginning of file)."
            end_sec:
              type: number
              nullable: true
              description: "Trim window end in seconds. Omit (or pass null) to trim to end of source."

    AudioMixRequest:
      allOf:
        - $ref: "#/components/schemas/MultiAudioInputRequest"
        - $ref: "#/components/schemas/BaseAudioOutputRequest"

    AudioConcatRequest:
      allOf:
        - $ref: "#/components/schemas/MultiAudioInputRequest"
        - $ref: "#/components/schemas/BaseAudioOutputRequest"

    AudioSpeedRequest:
      allOf:
        - $ref: "#/components/schemas/BaseAudioInputRequest"
        - $ref: "#/components/schemas/BaseAudioOutputRequest"
        - type: object
          required: [speed]
          properties:
            speed:
              type: number

    AudioConvertRequest:
      allOf:
        - $ref: "#/components/schemas/BaseAudioInputRequest"
        - $ref: "#/components/schemas/BaseAudioOutputRequest"
        - type: object
          properties:
            sample_rate:
              type: integer
              nullable: true
            channels:
              type: integer
              nullable: true

    AudioSimilarRequest:
      allOf:
        - $ref: "#/components/schemas/BaseAudioInputRequest"
        - type: object
          properties:
            reference_file_path:
              type: string
              nullable: true
              description: |
                Reference (second) file to compare against. Also
                accepted as `file_path_b` for the "compare two files"
                shape that's intuitive when the API is read out of
                context.
            reference_file_url:
              type: string
              nullable: true
              description: |
                Same as reference_file_path but for an HTTP URL the
                server fetches (subject to AUDIOLLA_FETCH_MODE policy).
                Also accepted as `file_url_b`.
            file_path_b:
              type: string
              nullable: true
              description: Alias for reference_file_path.
            file_url_b:
              type: string
              nullable: true
              description: Alias for reference_file_url.

    MidiQuantizeRequest:
      allOf:
        - $ref: "#/components/schemas/BaseAudioInputRequest"
        - $ref: "#/components/schemas/BaseAudioOutputRequest"
        - type: object
          properties:
            grid_beats:
              type: number
              default: 0.25

    AudioClassifyRequest:
      allOf:
        - $ref: "#/components/schemas/BaseAudioInputRequest"
        - type: object
          required: [labels]
          properties:
            labels:
              type: array
              description: Candidate label strings to score the audio against.
              items: { type: string }

    AudioFadeRequest:
      allOf:
        - $ref: "#/components/schemas/BaseAudioInputRequest"
        - $ref: "#/components/schemas/BaseAudioOutputRequest"
        - type: object
          properties:
            fade_in:
              type: number
              default: 0.0
              description: |
                Fade-in length in seconds (0 disables). Also accepted as
                `fade_in_sec` — the `_sec` suffix matches the rest of
                the API (`start_sec`, `end_sec`, etc.).
            fade_in_sec:
              type: number
              nullable: true
              description: Alias for fade_in. Wins if both are set.
            fade_out:
              type: number
              default: 0.0
              description: |
                Fade-out length in seconds (0 disables). Also accepted
                as `fade_out_sec`.
            fade_out_sec:
              type: number
              nullable: true
              description: Alias for fade_out. Wins if both are set.
            curve:
              type: string
              default: tri

    AudioReverseRequest:
      allOf:
        - $ref: "#/components/schemas/BaseAudioInputRequest"
        - $ref: "#/components/schemas/BaseAudioOutputRequest"

    AudioLoopRequest:
      allOf:
        - $ref: "#/components/schemas/BaseAudioInputRequest"
        - $ref: "#/components/schemas/BaseAudioOutputRequest"
        - type: object
          properties:
            count:
              type: integer
              default: 2

    AudioBpmMatchRequest:
      allOf:
        - $ref: "#/components/schemas/BaseAudioInputRequest"
        - $ref: "#/components/schemas/BaseAudioOutputRequest"
        - type: object
          required: [target_bpm]
          properties:
            target_bpm:
              type: number
            pitch_semitones:
              type: number
              default: 0.0

    AudioStereoWidthRequest:
      allOf:
        - $ref: "#/components/schemas/BaseAudioInputRequest"
        - $ref: "#/components/schemas/BaseAudioOutputRequest"
        - type: object
          properties:
            width:
              type: number
              default: 1.0

    AudioSplitRequest:
      allOf:
        - $ref: "#/components/schemas/BaseAudioInputRequest"
        - $ref: "#/components/schemas/BaseAudioOutputRequest"
        - type: object
          properties:
            mode:
              type: string
              enum: [equal, silence]
              default: equal
            count:
              type: integer
              nullable: true
            threshold_db:
              type: number
              default: -30.0
            min_duration_sec:
              type: number
              default: 0.5

    AudioPanRequest:
      allOf:
        - $ref: "#/components/schemas/BaseAudioInputRequest"
        - $ref: "#/components/schemas/BaseAudioOutputRequest"
        - type: object
          properties:
            position:
              type: number
              default: 0.0

    AudioEqRequest:
      allOf:
        - $ref: "#/components/schemas/BaseAudioInputRequest"
        - $ref: "#/components/schemas/BaseAudioOutputRequest"
        - type: object
          required: [bands]
          properties:
            bands:
              type: array
              description: Array of band specifications (object per band).
              items: { type: object, additionalProperties: true }

    AudioKeyMatchRequest:
      allOf:
        - $ref: "#/components/schemas/BaseAudioInputRequest"
        - $ref: "#/components/schemas/BaseAudioOutputRequest"
        - type: object
          required: [target_key]
          properties:
            target_key:
              type: string

    AudioSidechainDuckRequest:
      allOf:
        - $ref: "#/components/schemas/BaseAudioInputRequest"
        - $ref: "#/components/schemas/BaseAudioOutputRequest"
        - type: object
          properties:
            trigger_file_path:
              type: string
              nullable: true
            trigger_file_url:
              type: string
              nullable: true
            threshold_db:
              type: number
              default: -20.0
            ratio:
              type: number
              default: 4.0
            attack_ms:
              type: number
              default: 10.0
            release_ms:
              type: number
              default: 200.0

    AudioMetadataRequest:
      allOf:
        - $ref: "#/components/schemas/BaseAudioInputRequest"
        - $ref: "#/components/schemas/BaseAudioOutputRequest"
        - type: object
          properties:
            tags:
              type: string
              nullable: true
              description: |
                JSON-encoded tag dict to write. Omit / null = read-only
                mode (returns the file's current tags). When supplied,
                the handler writes the tags into the audio file's
                container and — if ``output_path`` or ``output_url`` is
                also set — persists the tagged audio there. Without
                an output target, write-mode is no-op-persistent (tags
                applied to bytes in memory; updated tag set returned
                in the response; no file landed).

    AudioClipDetectRequest:
      allOf:
        - $ref: "#/components/schemas/BaseAudioInputRequest"

    AudioMidSideRequest:
      allOf:
        - $ref: "#/components/schemas/BaseAudioInputRequest"
        - $ref: "#/components/schemas/BaseAudioOutputRequest"
        - type: object
          required: [mode]
          properties:
            mode:
              type: string
              enum: [encode, decode]

    AudioBeatSliceRequest:
      allOf:
        - $ref: "#/components/schemas/BaseAudioInputRequest"
        - $ref: "#/components/schemas/BaseAudioOutputRequest"

    AudioConvReverbRequest:
      allOf:
        - $ref: "#/components/schemas/BaseAudioInputRequest"
        - $ref: "#/components/schemas/BaseAudioOutputRequest"
        - type: object
          properties:
            ir_file_path:
              type: string
              nullable: true
            ir_file_url:
              type: string
              nullable: true
            wet_mix:
              type: number
              default: 0.3

    AudioTransientRequest:
      allOf:
        - $ref: "#/components/schemas/BaseAudioInputRequest"
        - $ref: "#/components/schemas/BaseAudioOutputRequest"
        - type: object
          properties:
            attack_gain_db:
              type: number
              default: 0.0
            sustain_gain_db:
              type: number
              default: 0.0

    AudioMultibandCompressRequest:
      allOf:
        - $ref: "#/components/schemas/BaseAudioInputRequest"
        - $ref: "#/components/schemas/BaseAudioOutputRequest"
        - type: object
          required: [bands, crossovers_hz]
          properties:
            crossovers_hz:
              type: array
              description: Ascending crossover frequencies (Hz). 1 fewer than the number of bands.
              items: { type: number }
            bands:
              type: array
              description: Array of band specifications (object per band).
              items: { type: object, additionalProperties: true }

    AudioRemixRequest:
      allOf:
        - $ref: "#/components/schemas/BaseAudioInputRequest"
        - $ref: "#/components/schemas/BaseAudioOutputRequest"
        - type: object
          properties:
            engine:
              type: string
              default: htdemucs
              description: Stem-separation engine for the unmix step.
            stem_mix:
              type: object
              additionalProperties:
                type: number
              description: |
                Per-stem gain dict — keys are stem names ('vocals', 'drums',
                'bass', 'other'), values are linear gain multipliers (1.0 =
                keep, 0.0 = mute, 0.5 = -6 dB). Missing stems default to 1.0.

    AudioDjPrepRequest:
      allOf:
        - $ref: "#/components/schemas/BaseAudioInputRequest"

    AudioLoudnessCurveRequest:
      allOf:
        - $ref: "#/components/schemas/BaseAudioInputRequest"
        - type: object
          properties:
            hop_length:
              type: integer
              default: 512

    AudioPitchCorrectRequest:
      allOf:
        - $ref: "#/components/schemas/BaseAudioInputRequest"
        - $ref: "#/components/schemas/BaseAudioOutputRequest"
        - type: object
          properties:
            strength:
              type: number
              default: 1.0

    AudioRepairRequest:
      allOf:
        - $ref: "#/components/schemas/BaseAudioInputRequest"
        - $ref: "#/components/schemas/BaseAudioOutputRequest"
        - type: object
          properties:
            declip:
              type: boolean
              default: true
            dehum:
              type: boolean
              default: false
            hum_freq:
              type: number
              default: 50.0

    AudioLoopPointRequest:
      allOf:
        - $ref: "#/components/schemas/BaseAudioInputRequest"
        - type: object
          properties:
            min_loop_bars:
              type: integer
              default: 4
            num_candidates:
              type: integer
              default: 5

    AudioChordsToMidiRequest:
      allOf:
        - $ref: "#/components/schemas/BaseAudioInputRequest"
        - $ref: "#/components/schemas/BaseAudioOutputRequest"
        - type: object
          properties:
            tempo_bpm:
              type: number
              nullable: true
            velocity:
              type: integer
              default: 80
            octave:
              type: integer
              default: 4

    AudioDeessRequest:
      allOf:
        - $ref: "#/components/schemas/BaseAudioInputRequest"
        - $ref: "#/components/schemas/BaseAudioOutputRequest"
        - type: object
          properties:
            threshold_db:
              type: number
              default: -20.0
            frequency_hz:
              type: number
              default: 6000.0
            ratio:
              type: number
              default: 4.0

    AudioStereoFieldRequest:
      allOf:
        - $ref: "#/components/schemas/BaseAudioInputRequest"

    AudioThumbnailRequest:
      allOf:
        - $ref: "#/components/schemas/BaseAudioInputRequest"
        - $ref: "#/components/schemas/BaseAudioOutputRequest"
        - type: object
          properties:
            duration_sec:
              type: number
              default: 30.0

    MidiHumanizeRequest:
      allOf:
        - $ref: "#/components/schemas/BaseAudioInputRequest"
        - $ref: "#/components/schemas/BaseAudioOutputRequest"
        - type: object
          properties:
            timing_ms:
              type: number
              default: 10.0
            velocity_pct:
              type: number
              default: 10.0
            seed:
              type: integer
              nullable: true

    # ── dedicated generate engines (manual) ──
    StableAudioOpenRequest:
      allOf:
        - $ref: "#/components/schemas/BaseGenerateRequest"
        - $ref: "#/components/schemas/BaseAudioOutputRequest"
        - type: object
          properties:
            num_inference_steps: { type: integer, minimum: 1, maximum: 500, default: 100 }
            negative_prompt: { type: string, default: 'low quality, average quality' }

    MusicGenRequest:
      allOf:
        - $ref: "#/components/schemas/BaseGenerateRequest"
        - $ref: "#/components/schemas/BaseAudioOutputRequest"
        - type: object
          properties:
            lyrics:
              type: string
              nullable: true
              description: Accepted for API uniformity; MusicGen is instrumental-only.

    RiffusionRequest:
      allOf:
        - $ref: "#/components/schemas/BaseGenerateRequest"
        - $ref: "#/components/schemas/BaseAudioOutputRequest"
        - type: object

    AudioLDM2Request:
      allOf:
        - $ref: "#/components/schemas/BaseGenerateRequest"
        - $ref: "#/components/schemas/BaseAudioOutputRequest"
        - type: object
          properties:
            num_inference_steps: { type: integer, minimum: 1, maximum: 500, default: 200 }
            negative_prompt: { type: string, default: 'Low quality.' }

