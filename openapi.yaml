  # ── Jobs ─────────────────────────────────────────────────────────────────
  /v1/jobs:
    get:
      tags: ["Jobs"]
      summary: List async jobs
      operationId: listJobs
      responses:
        "200":
          description: Job list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobs:
