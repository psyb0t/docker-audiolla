        "401": { $ref: "#/components/responses/401" }

  /v1/jobs/{job_id}:
    get:
      tags: ["Jobs"]
      summary: Get job status / result
      operationId: getJob
      parameters:
        - $ref: "#/components/parameters/JobIdPath"
      responses:
        "200":
          description: Job state.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  job_id: { type: string }
                  status: { type: string, enum: [pending, running, completed, failed, cancelled] }
                  result: { type: object, additionalProperties: true, nullable: true }
                  error: { type: string, nullable: true }
        "401": { $ref: "#/components/responses/401" }
        "404": { $ref: "#/components/responses/404" }
    delete:
      tags: ["Jobs"]
      summary: Cancel a pending or running job
      operationId: cancelJob
      parameters:
        - $ref: "#/components/parameters/JobIdPath"
      responses:
        "200":
          description: Job cancelled.
          content:
            application/json:
              schema:
                type: object
                properties:
                  cancelled: { type: string }
        "401": { $ref: "#/components/responses/401" }
        "404": { $ref: "#/components/responses/404" }

  # ── Files ────────────────────────────────────────────────────────────────
  /v1/files:
    get:
      tags: ["Files"]
      summary: List staged files
      operationId: filesList
      responses:
        "200":
          description: File listing.
          content:
            application/json:
              schema:
                type: object
                properties:
                  files:
                    type: array
                    items:
                      type: object
                      properties:
                        path: { type: string }
                        size: { type: integer }
                        modified: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/401" }

  /v1/files/{path}:
    put:
      tags: ["Files"]
      summary: Stage a file (multipart octet-stream upload)
      operationId: filesPut
      description: |
        The ONLY endpoint that accepts raw bytes on the wire. All other
        audio endpoints reference staged files via `file_path` or
        external URLs via `file_url`.
      parameters:
        - $ref: "#/components/parameters/FilesPath"
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { $ref: "#/components/schemas/AudioBlob" }
      responses:
        "201":
          description: File staged.
          content:
            application/json:
              schema:
                type: object
                properties:
                  path: { type: string }
                  size: { type: integer }
        "400": { $ref: "#/components/responses/400" }
        "401": { $ref: "#/components/responses/401" }
        "413": { $ref: "#/components/responses/413" }
    get:
      tags: ["Files"]
      summary: Download a staged file
      operationId: filesGet
      parameters:
        - $ref: "#/components/parameters/FilesPath"
      responses:
        "200":
          description: File bytes.
          content:
            application/octet-stream:
              schema: { $ref: "#/components/schemas/AudioBlob" }
        "401": { $ref: "#/components/responses/401" }
        "404": { $ref: "#/components/responses/404" }
    delete:
      tags: ["Files"]
      summary: Delete a staged file
      operationId: filesDelete
      parameters:
        - $ref: "#/components/parameters/FilesPath"
      responses:
        "200":
          description: File deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: string }
        "401": { $ref: "#/components/responses/401" }
        "404": { $ref: "#/components/responses/404" }
        "500": { $ref: "#/components/responses/500" }

  # ── MIDI generation (JSON spec bodies) ───────────────────────────────────
  /v1/midi/compose:
    post:
      tags: ["MIDI"]
      summary: Compose a song spec to a Standard MIDI File
      operationId: midiCompose
      description: |
        Body is the song spec (tempo_bpm, time_signature, key_signature,
        ticks_per_beat, tracks). Server returns raw MIDI bytes by default,
        or JSON descriptor when `output_path` / `output_url` are set as
        query parameters.
      parameters:
        - in: query
          name: output_path
          schema: { type: string }
          required: false
        - in: query
          name: output_url
          schema: { type: string, format: uri }
          required: false
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200":
          description: MIDI bytes or staged-output JSON.
          content:
            audio/midi:
              schema: { $ref: "#/components/schemas/AudioBlob" }
            application/json:
              schema:
                oneOf:
