  # ── Engines / Catalog / Lifecycle ────────────────────────────────────────
  /v1/engines:
    get:
      tags: ["Engines"]
      summary: List configured engines
      operationId: listEngines
      responses:
        "200":
          description: Engine inventory.
          content:
            application/json:
              schema:
                type: object
                required: [object, data]
                properties:
                  object: { type: string, enum: [list] }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/EngineInfo" }
        "401": { $ref: "#/components/responses/401" }

  /v1/catalog:
    get:
      tags: ["Engines"]
      summary: Machine-readable endpoint catalog
      operationId: catalog
      description: |
        Returns the categorised endpoint list — same data the documentation
        sidebar uses. Useful for LLM agents discovering what audiolla can do
        without parsing the full OpenAPI spec.
      responses:
        "200":
          description: Catalog.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "401": { $ref: "#/components/responses/401" }

  /v1/ops:
    get:
      tags: ["Engines"]
      summary: List pipeline op slugs
      operationId: listOps
      description: Ops available to `/v1/pipeline` and `/v1/presets/{name}`.
      responses:
        "200":
          description: Op list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ops:
                    type: array
                    items: { type: string }
        "401": { $ref: "#/components/responses/401" }

  /v1/ps:
    get:
      tags: ["Engines"]
      summary: List currently loaded engines
      operationId: listLoaded
      responses:
        "200":
          description: Loaded engines.
          content:
            application/json:
              schema:
                type: object
                required: [engines]
                properties:
                  engines:
                    type: array
                    items:
                      type: object
                      required: [slug, executor, loaded]
                      properties:
                        slug: { type: string }
                        executor: { type: string }
                        loaded: { type: boolean }
                        idle_seconds: { type: number, nullable: true }
        "401": { $ref: "#/components/responses/401" }

  /v1/ps/{engine}:
    delete:
      tags: ["Engines"]
      summary: Evict one engine from memory
      operationId: unloadOne
      parameters:
        - $ref: "#/components/parameters/EnginePath"
      responses:
        "200":
          description: Engine evicted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  unloaded: { type: string }
        "401": { $ref: "#/components/responses/401" }
        "404": { $ref: "#/components/responses/404" }

  /v1/unload:
    post:
      tags: ["Engines"]
      summary: Evict every loaded engine
      operationId: unloadAll
      responses:
        "200":
          description: All engines evicted.
          content:
