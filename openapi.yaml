  # ── Workflow ─────────────────────────────────────────────────────────────
  /v1/batch:
    post:
      tags: ["Audio Mixing"]
      summary: Apply a single operation to many input files at once
      operationId: batch
      description: |
        Run the same transform against a list of staged files (or URLs).
        Body is a JSON array of independent per-file request objects (the
        same shape the underlying operation takes). Server returns a JSON
        list of per-file results.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { type: object, additionalProperties: true }
      responses:
        "200":
          description: Per-file result array.
          content:
            application/json:
              schema:
                type: array
                items: { type: object, additionalProperties: true }
        "400": { $ref: "#/components/responses/400" }
        "401": { $ref: "#/components/responses/401" }
        "413": { $ref: "#/components/responses/413" }
        "422": { $ref: "#/components/responses/422" }
        "500": { $ref: "#/components/responses/500" }

  /v1/pipeline:
    post:
      tags: ["Workflow"]
      summary: Ad-hoc op chain across one input
      operationId: runPipeline
      description: |
        Apply N transforms in order to one input. Body is `{file_path | file_url, steps: [{op, params}, ...], output_path | output_url}`.
        Intermediates stay in memory between steps — no re-upload required.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PipelineRunRequest" }
      responses:
        "200":
          description: Pipeline executed.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/StagedOutputResponse"
                  - $ref: "#/components/schemas/UrlOutputResponse"
        "202":
          description: Async job accepted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobAcceptedResponse" }
        "400": { $ref: "#/components/responses/400" }
        "401": { $ref: "#/components/responses/401" }
        "404": { $ref: "#/components/responses/404" }
        "413": { $ref: "#/components/responses/413" }
        "415": { $ref: "#/components/responses/415" }
        "422": { $ref: "#/components/responses/422" }
        "500": { $ref: "#/components/responses/500" }

  /v1/presets:
    get:
      tags: ["Workflow"]
      summary: List configured workflow presets
      operationId: listPresets
      responses:
        "200":
          description: Preset list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  presets:
