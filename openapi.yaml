  # ── Workflow ─────────────────────────────────────────────────────────────
  /v1/batch:
    post:
      tags: ["Audio Mixing"]
      summary: "Run operations in a batch"
      operationId: batch
      description: "Submit independent operations on staged files in one request. Each item names its operation and supplies its own inputs and options. Items execute in order and report their own result or error."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { type: object, additionalProperties: true }
            example:
            - op: trim
              file_path: uploads/song.wav
              output_path: out/short-clip.wav
              start_sec: 1
              end_sec: 4
            - op: convert
              file_path: uploads/song.wav
              output_path: out/song.flac
              output_format: flac
      responses:
        "200":
          description: Per-file result array.
          content:
            application/json:
              schema:
                type: array
                items: { type: object, additionalProperties: true }
        "400": { $ref: "#/components/responses/400" }
        "401": { $ref: "#/components/responses/401" }
        "413": { $ref: "#/components/responses/413" }
        "422": { $ref: "#/components/responses/422" }
        "500": { $ref: "#/components/responses/500" }

  /v1/pipeline:
    post:
      tags: ["Workflow"]
      summary: "Run an audio pipeline"
      operationId: runPipeline
      description: "Apply an ordered chain of operations to one input. The output of one step feeds the next without re-uploading it. Use the pipeline operations list to discover accepted step names."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PipelineRunRequest" }
            example:
              file_path: uploads/song.wav
              output_path: out/pipeline.wav
              steps:
              - op: trim
                params:
                  start_sec: 1
                  end_sec: 8
              - op: normalize
                params:
                  target_lufs: -16
      responses:
        "200":
          description: Pipeline executed.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/StagedOutputResponse"
                  - $ref: "#/components/schemas/UrlOutputResponse"
        "202":
          description: Async job accepted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobAcceptedResponse" }
        "400": { $ref: "#/components/responses/400" }
        "401": { $ref: "#/components/responses/401" }
        "404": { $ref: "#/components/responses/404" }
        "413": { $ref: "#/components/responses/413" }
        "415": { $ref: "#/components/responses/415" }
        "422": { $ref: "#/components/responses/422" }
        "500": { $ref: "#/components/responses/500" }

  /v1/presets:
    get:
      tags: ["Workflow"]
      summary: "List workflow presets"
      operationId: listPresets
      description: "Discover the preset names and their descriptions before running a saved workflow."
      responses:
        "200":
          description: Preset list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  presets:
                    type: array
                    items: { type: string }
        "401": { $ref: "#/components/responses/401" }

  /v1/presets/{name}:
    get:
      tags: ["Workflow"]
      summary: "Describe a workflow preset"
      operationId: describePreset
      description: "Read the selected preset's steps and parameter definitions before supplying input or overrides."
      parameters:
        - in: path
          name: name
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Preset description.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "401": { $ref: "#/components/responses/401" }
        "404": { $ref: "#/components/responses/404" }
    post:
      tags: ["Workflow"]
      summary: "Run a workflow preset"
      operationId: runPreset
      description: "Apply the named preset's ordered steps to one input. Supply overrides only for parameters that preset exposes."
      parameters:
        - in: path
          name: name
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PresetRunRequest" }
            example:
              file_path: uploads/song.wav
              output_path: out/mastered.wav
      responses:
        "200":
          description: Preset executed.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/StagedOutputResponse"
                  - $ref: "#/components/schemas/UrlOutputResponse"
        "202":
          description: Async job accepted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobAcceptedResponse" }
        "400": { $ref: "#/components/responses/400" }
        "401": { $ref: "#/components/responses/401" }
        "404": { $ref: "#/components/responses/404" }
        "413": { $ref: "#/components/responses/413" }
        "415": { $ref: "#/components/responses/415" }
        "422": { $ref: "#/components/responses/422" }
        "500": { $ref: "#/components/responses/500" }

  # ── Engines / Catalog / Lifecycle ────────────────────────────────────────
  /v1/engines:
    get:
      tags: ["Engines"]
      summary: "List available engines"
      operationId: listEngines
      description: "See which engine slugs and capabilities the running deployment has configured."
      responses:
        "200":
          description: Engine inventory.
          content:
            application/json:
              schema:
                type: object
                required: [object, data]
                properties:
                  object: { type: string, enum: [list] }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/EngineInfo" }
        "401": { $ref: "#/components/responses/401" }

  /v1/catalog:
    get:
      tags: ["Engines"]
      summary: "Browse the REST operation catalog"
      operationId: catalog
      description: "Discover available REST operations grouped by purpose. Use the OpenAPI reference for request and response details."
      responses:
        "200":
          description: Catalog.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "401": { $ref: "#/components/responses/401" }

  /v1/ops:
    get:
      tags: ["Engines"]
      summary: "List pipeline operations"
      operationId: listOps
      description: "Return operation names that can be used in pipeline steps. These names belong in the op field of each step."
      responses:
        "200":
          description: Op list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ops:
                    type: array
                    items: { type: string }
        "401": { $ref: "#/components/responses/401" }

  /v1/ps:
    get:
      tags: ["Engines"]
      summary: "List loaded engines"
      operationId: listLoaded
      description: "Show the engines currently loaded in memory. Use the available-engines list to include engines that can load on demand."
      responses:
        "200":
          description: Loaded engines.
          content:
            application/json:
              schema:
                type: object
                required: [engines]
                properties:
                  engines:
                    type: array
                    items:
                      type: object
                      required: [slug, executor, loaded]
                      properties:
                        slug: { type: string }
                        executor: { type: string }
                        loaded: { type: boolean }
                        idle_seconds: { type: number, nullable: true }
        "401": { $ref: "#/components/responses/401" }

  /v1/ps/{engine}:
    delete:
      tags: ["Engines"]
      summary: "Unload an engine"
      operationId: unloadOne
      description: "Ask the server to release the selected engine's in-memory model. The next request for that engine can load it again."
      parameters:
        - $ref: "#/components/parameters/EnginePath"
      responses:
        "200":
          description: Engine evicted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  unloaded: { type: string }
        "401": { $ref: "#/components/responses/401" }
        "404": { $ref: "#/components/responses/404" }

  /v1/unload:
    post:
      tags: ["Engines"]
      summary: "Unload all engines"
      operationId: unloadAll
      description: "Ask the server to release all currently loaded models from memory."
      responses:
        "200":
          description: All engines evicted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  unloaded:
                    type: array
                    items: { type: string }
        "401": { $ref: "#/components/responses/401" }

  # ── Jobs ─────────────────────────────────────────────────────────────────
  /v1/jobs:
    get:
      tags: ["Jobs"]
      summary: "List background jobs"
      operationId: listJobs
      description: "Return jobs tracked by the running server. Filter by status when you only need jobs in a particular state."
      responses:
        "200":
          description: Job list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobs:
                    type: array
                    items: { type: object, additionalProperties: true }
        "401": { $ref: "#/components/responses/401" }

  /v1/jobs/{job_id}:
    get:
      tags: ["Jobs"]
      summary: "Get a background job"
      operationId: getJob
      description: "Poll the job ID returned at submission. The response reports the current state and includes a result or error when available."
      parameters:
        - $ref: "#/components/parameters/JobIdPath"
      responses:
        "200":
          description: Job state.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  job_id: { type: string }
                  status: { type: string, enum: [pending, running, completed, failed, cancelled] }
                  result: { type: object, additionalProperties: true, nullable: true }
                  error: { type: string, nullable: true }
        "401": { $ref: "#/components/responses/401" }
        "404": { $ref: "#/components/responses/404" }
    delete:
      tags: ["Jobs"]
      summary: "Cancel or remove a background job"
      operationId: cancelJob
      description: "Request cancellation of an active job or remove an existing terminal job record."
      parameters:
        - $ref: "#/components/parameters/JobIdPath"
      responses:
        "200":
          description: Job cancelled.
          content:
            application/json:
              schema:
                type: object
                properties:
                  cancelled: { type: string }
        "401": { $ref: "#/components/responses/401" }
        "404": { $ref: "#/components/responses/404" }

  # ── Files ────────────────────────────────────────────────────────────────
  /v1/files:
    get:
      tags: ["Files"]
      summary: "List staged files"
      operationId: filesList
      description: "Browse files available in the staging area, with their paths and sizes. Use a staged path as input to a processing request."
      responses:
        "200":
          description: File listing.
          content:
            application/json:
              schema:
                type: object
                properties:
                  files:
                    type: array
                    items:
                      type: object
                      properties:
                        path: { type: string }
                        size: { type: integer }
                        modified: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/401" }

  /v1/files/{path}:
    put:
      tags: ["Files"]
      summary: "Upload a staged file"
      operationId: filesPut
      description: "Send the file bytes as application/octet-stream and put its staging path in the URL. Uploading to an existing path replaces that file."
      parameters:
        - $ref: "#/components/parameters/FilesPath"
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { $ref: "#/components/schemas/AudioBlob" }
      responses:
        "201":
          description: File staged.
          content:
            application/json:
              schema:
                type: object
                properties:
                  path: { type: string }
                  size: { type: integer }
        "400": { $ref: "#/components/responses/400" }
        "401": { $ref: "#/components/responses/401" }
        "413": { $ref: "#/components/responses/413" }
    get:
      tags: ["Files"]
      summary: "Download a staged file"
      operationId: filesGet
      description: "Return the bytes of the file at the requested staging path. Use this to retrieve uploaded inputs and processed outputs."
      parameters:
        - $ref: "#/components/parameters/FilesPath"
      responses:
        "200":
          description: File bytes.
          content:
            application/octet-stream:
              schema: { $ref: "#/components/schemas/AudioBlob" }
        "401": { $ref: "#/components/responses/401" }
        "404": { $ref: "#/components/responses/404" }
    delete:
      tags: ["Files"]
      summary: "Delete a staged file"
      operationId: filesDelete
      description: "Remove the file at the exact staging path, including any empty parent directories left behind."
      parameters:
        - $ref: "#/components/parameters/FilesPath"
      responses:
        "200":
          description: File deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: string }
        "401": { $ref: "#/components/responses/401" }
        "404": { $ref: "#/components/responses/404" }
        "500": { $ref: "#/components/responses/500" }

  # ── MIDI generation (JSON spec bodies) ───────────────────────────────────
  /v1/midi/compose:
    post:
      tags: ["MIDI"]
      summary: "Compose a MIDI file"
      operationId: midiCompose
      description: "Send a JSON score with tracks and notes. The response is MIDI bytes by default, or a file descriptor when you provide an output destination in the query string."
      parameters:
        - in: query
          name: output_path
          schema: { type: string }
          required: false
        - in: query
          name: output_url
          schema: { type: string, format: uri }
          required: false
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
            example: &simple_midi_score
              tempo_bpm: 120
              tracks:
                - name: Piano
                  program: 0
                  notes:
                    - { pitch: 60, start_beats: 0, duration_beats: 1 }
                    - { pitch: 64, start_beats: 1, duration_beats: 1 }
                    - { pitch: 67, start_beats: 2, duration_beats: 1 }
      responses:
        "200":
          description: MIDI bytes or staged-output JSON.
          content:
            audio/midi:
              schema: { $ref: "#/components/schemas/AudioBlob" }
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/StagedOutputResponse"
                  - $ref: "#/components/schemas/UrlOutputResponse"
        "400": { $ref: "#/components/responses/400" }
        "401": { $ref: "#/components/responses/401" }
        "500": { $ref: "#/components/responses/500" }

  /v1/midi/drum:
    post:
      tags: ["MIDI"]
      summary: "Build a MIDI drum pattern"
      operationId: midiDrum
      description: "Send named percussion voices and step sequences as JSON. The response is MIDI bytes by default, or a file descriptor when you supply an output destination in the query string."
      parameters:
        - in: query
          name: output_path
          schema: { type: string }
          required: false
        - in: query
          name: output_url
          schema: { type: string, format: uri }
          required: false
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
            example:
              tempo_bpm: 120
              steps: 4
              bars: 1
              pattern:
                kick: [1, 0, 0, 0]
                snare: [0, 0, 1, 0]
                hihat: [1, 1, 1, 1]
      responses:
        "200":
          description: MIDI bytes or staged-output JSON.
          content:
            audio/midi:
              schema: { $ref: "#/components/schemas/AudioBlob" }
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/StagedOutputResponse"
                  - $ref: "#/components/schemas/UrlOutputResponse"
        "400": { $ref: "#/components/responses/400" }
        "401": { $ref: "#/components/responses/401" }
        "500": { $ref: "#/components/responses/500" }

  /v1/midi/generate:
    post:
      tags: ["MIDI"]
      summary: "Compose and render audio"
      operationId: midiGenerate
      description: "Send the same score as MIDI compose, then render it through FluidSynth in one request. Set the audio format and destination in the query string."
      parameters:
        - in: query
          name: output_format
          schema: { $ref: "#/components/schemas/OutputFormat" }
          required: false
        - in: query
          name: soundfont_path
          schema: { type: string }
          required: false
        - in: query
          name: gain
          schema: { type: number, default: 0.5 }
          required: false
        - in: query
          name: samplerate
          schema: { type: integer, default: 44100 }
          required: false
        - in: query
          name: output_path
          schema: { type: string }
          required: false
        - in: query
          name: output_url
          schema: { type: string, format: uri }
          required: false
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
            example: *simple_midi_score
      responses:
        "200":
          description: Audio bytes or staged-output JSON.
          content:
            audio/wav:
              schema: { $ref: "#/components/schemas/AudioBlob" }
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/StagedOutputResponse"
                  - $ref: "#/components/schemas/UrlOutputResponse"
        "400": { $ref: "#/components/responses/400" }
        "401": { $ref: "#/components/responses/401" }
        "415": { $ref: "#/components/responses/415" }
        "500": { $ref: "#/components/responses/500" }
