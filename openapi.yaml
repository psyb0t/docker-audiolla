openapi: "3.1.0"

info:
  title: audiolla
  version: "2.0.3"
  description: |
    Self-hosted audio-production REST + MCP API. Stem separation,
    restoration, mastering, MIR analysis, DSP transforms, loudness,
    speech enhancement, voice activity detection, speaker diarization,
    MIDI transcription + composition, text-to-music + text-to-SFX
    generation, curated workflow presets, ad-hoc op pipelines.

    The MCP endpoint at /v1/mcp is JSON-RPC over a streamable HTTP
    transport and is NOT described in this document — use an MCP client.

    ## API contract (v1.0.0 — breaking changes from v0.23.x)

    Every audio endpoint takes a JSON body. Multipart upload is supported
    only on `PUT /v1/files/{path}` — the local-staging interface.

    **Input** — exactly one of:
      - `file_path` (FILES_DIR-relative, server reads from local /v1/files
        staging area)
      - `file_url` (any HTTP/HTTPS URL the server fetches; works with
        AWS Sig V4 presigned GETs, plain HTTP, hybrids3 buckets, etc.)

    **Output** — exactly one of:
      - `output_path` (server writes to FILES_DIR/<path>, response JSON is
        `{path, size, ...}`; caller downloads via `GET /v1/files/<path>`)
      - `output_url` (server PUTs to the URL — must be a presigned PUT URL
        for AWS Sig V4 services or a plain PUT-accepting endpoint;
        response JSON is `{url, size, ...}`)

    `async_job=true` auto-stages to `jobs/{id}.{ext}` under FILES_DIR if
    neither output is given.

servers:
  - url: http://localhost:8000

security:
  - BearerAuth: []

tags:
  - name: Health
    description: Liveness probes and discovery.
  - name: Engines
    description: List, inspect, evict registered engines.
  - name: Files
    description: Local staging area — upload, download, delete files referenced by other endpoints.
  - name: Jobs
    description: Async-job queue — submit, poll, cancel long-running operations.
  - name: Audio Analysis
    description: Audio → JSON. BPM / key / chords / loudness / beats / fingerprint / chroma / VAD / silence / classify / similarity / metadata / info / clip detection.
  - name: Audio Transform
    description: Audio → audio. DSP transforms — normalize, EQ, fade, trim, reverse, speed, stretch, pitch correct, loop, pan, FX, sox chains.
  - name: Audio Restoration
    description: Audio → audio. Noise reduction, de-essing, multiband compression, dynamics, repair, conv reverb.
  - name: Audio Separation
    description: Stem separation, harmonic/percussive split, vocal isolation, restoration via UVR / Demucs.
  - name: Audio Mixing
    description: Multi-file → audio. Concat, mix, remix, BPM/key match, DJ prep, batch.
  - name: Audio Generation
    description: Text → audio. Stable Audio Open, MusicGen, Riffusion, AudioLDM 2.
  - name: Audio Visualization
    description: Audio → image/video. Spectrogram, waveform, animated visualizers.
  - name: MIDI
    description: MIDI composition, rendering, transformation, audio→MIDI transcription.
  - name: Workflow
    description: Presets, ad-hoc pipelines, named workflows.


components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer

  parameters:
    EnginePath:
      in: path
      name: engine
      required: true
      schema:
        type: string
      description: Engine slug (e.g. `htdemucs`, `uvr-vocal-bsr`, `basic-pitch`).
    ModePath:
      in: path
      name: mode
      required: true
      schema:
        type: string
      description: Endpoint-specific mode token (e.g. `encode`/`decode` for mid-side).
    FilesPath:
      in: path
      name: path
      required: true
      schema:
        type: string
      description: FILES_DIR-relative path (slashes allowed).
    JobIdPath:
      in: path
      name: job_id
      required: true
      schema:
        type: string
      description: UUID of an async job.

  responses:
    "400":
      description: Bad request — invalid input or constraint violation.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    "401":
      description: Missing or invalid bearer token.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    "404":
      description: Engine or file not found.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    "413":
      description: Payload too large.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    "415":
      description: Unsupported output format / media type.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    "422":
      description: Validation error — request body schema mismatch.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    "500":
      description: Internal server error.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }

  schemas:
    ErrorBody:
      type: object
      required: [detail]
      properties:
        detail: { type: string, description: "Explanation of why the request failed." }

    OutputFormat:
      type: string
      enum: [wav, mp3, flac, opus, aac, pcm]

    AudioBlob:
      type: string
      format: binary

    BaseAudioInputRequest:
      type: object
      description: |
        Single-file audio input. Provide exactly one of `file_path` or
        `file_url`. Mutually exclusive, validated server-side.
      properties:
        file_path:
          type: string
          nullable: true
          description: FILES_DIR-relative path (pre-staged via PUT /v1/files/{path}).
        file_url:
          type: string
          format: uri
          nullable: true
          description: HTTP/HTTPS URL the server fetches (subject to AUDIOLLA_FETCH_MODE).

    MultiAudioInputRequest:
      type: object
      description: |
        Multi-file audio input. Provide exactly one of `file_paths` or `file_urls`.
      properties:
        file_paths:
          description: "Relative paths of staged inputs, in processing order. Use file_urls for remote inputs instead."
          type: array
          items: { type: string }
          minItems: 1
          nullable: true
        file_urls:
          description: "HTTP(S) input URLs in processing order. Use file_paths for staged inputs instead."
          type: array
          items: { type: string, format: uri }
          minItems: 1
          nullable: true

    BaseAudioOutputRequest:
      type: object
      description: |
        Audio-producing endpoint output. Provide exactly one of `output_path` or
        `output_url`. async_job=true auto-stages to jobs/{id}.{ext} if neither.
      properties:
        output_format:
          $ref: "#/components/schemas/OutputFormat"
          default: wav
          description: Encoding for the output audio, including audio files inside a ZIP.
        output_path:
          type: string
          nullable: true
          description: FILES_DIR-relative path; response is JSON {path, size, ...}.
        output_url:
          type: string
          format: uri
          nullable: true
          description: Presigned PUT URL (S3, hybrids3, MinIO, R2, etc.) — response is JSON {url, size, ...}.
        async_job:
          type: boolean
          default: false
          description: Run in the background and return a job ID to poll.
        webhook_url:
          type: string
          format: uri
          nullable: true
          description: Optional URL that receives a POST when the background job finishes.

    BaseGenerateRequest:
      type: object
      required: [prompt]
      properties:
        prompt: { type: string, minLength: 1, description: "Text describing the audio to generate." }
        duration_sec:
          description: "Requested length of the result, in seconds. Each model has its own maximum."
          type: number
          minimum: 0.001
          default: 10.0
        seed: { type: integer, nullable: true, description: "Random seed for repeatable results with the same model and settings." }

    StagedOutputResponse:
      type: object
      required: [path, size]
      properties:
        path: { type: string, description: "Relative staging path. Use it to download the result." }
        size: { type: integer, description: "Size of the result in bytes." }
        output_format: { type: string, nullable: true, description: "Encoding for the written audio." }

    UrlOutputResponse:
      type: object
      required: [url, size]
      properties:
        url: { type: string, format: uri, description: "Destination URL to which the result was written." }
        size: { type: integer, description: "Size of the result in bytes." }
        output_format: { type: string, nullable: true, description: "Encoding for the written audio." }

    JobAcceptedResponse:
      type: object
      required: [job_id, status_url]
      properties:
        job_id: { type: string, description: "ID returned when the server accepts a background job." }
        status_url: { type: string, format: uri, description: "URL to poll for the job state and result." }

    NormalizeResponse:
      allOf:
        - $ref: "#/components/schemas/StagedOutputResponse"
        - type: object
          properties:
            target_lufs: { type: number, nullable: true, description: "Target integrated loudness in LUFS." }
            measured_lufs: { type: number, nullable: true, description: "Integrated loudness measured by the normalization operation." }

    AnalyzeResult:
      type: object
      properties:
        bpm: { type: number, nullable: true, description: "Estimated beats per minute." }
        key: { type: string, nullable: true, description: "Estimated musical key and mode." }
        loudness_lufs: { type: number, nullable: true, description: "Integrated loudness in LUFS." }
        duration: { type: number, nullable: true, description: "Duration of the recording in seconds." }
        spectral_centroid: { type: number, nullable: true, description: "Mean spectral centroid in hertz." }
        rms: { type: number, nullable: true, description: "Root mean square amplitude." }
        zcr: { type: number, nullable: true, description: "Mean zero-crossing rate." }

    LoudnessResult:
      type: object
      required: [loudness_lufs]
      properties:
        loudness_lufs: { type: number, description: "Integrated loudness in LUFS." }
        target_lufs: { type: number, nullable: true, description: "Target integrated loudness in LUFS." }
        normalized: { type: boolean, description: "Whether normalization was applied." }

    HealthResponse:
      type: object
      required: [ok, device, engines]
      properties:
        ok: { type: boolean, description: "Whether the server is responding." }
        device: { type: string, description: "Compute device selected by the server." }
        engines:
          description: "Engine slugs configured for this server."
          type: array
          items: { type: string }

    EngineInfo:
      type: object
      required: [slug, executor]
      properties:
        slug: { type: string, description: "Engine identifier used in requests." }
        executor: { type: string, description: "Backend implementation for this engine." }
        variant: { type: string, nullable: true, description: "Model variant used by the backend." }
        stems:
          description: "Stem names the engine can produce."
          type: array
          items: { type: string }
        presets:
          description: "Names of presets supported by this engine."
          type: array
          items: { type: string }
        loaded: { type: boolean, nullable: true, description: "Whether the engine is currently in memory." }
        idle_seconds: { type: number, nullable: true, description: "Seconds since the loaded engine last served a request." }
        description: { type: string, nullable: true, description: "Purpose of this configured engine." }

    # ── per-endpoint request schemas (generated from server handler signatures) ──
    AudioSeparateRequest:
      allOf:
        - $ref: "#/components/schemas/BaseAudioInputRequest"
        - $ref: "#/components/schemas/BaseAudioOutputRequest"
        - type: object
          required: [engine]
          properties:
            engine:
              type: string
              default: htdemucs
              description: |
                Configured stem-separation engine slug, such as `htdemucs` or
                `uvr-vocal-bsr`. Use GET /v1/engines to check availability.
            stems:
              type: array
              items:
                type: string
              default: []
              description: Case-sensitive names from the selected engine, such as vocals for Demucs. Omit this field or send an empty list for all available stems.

    PresetRunRequest:
      type: object
      description: |
        Body for ``POST /v1/presets/{name}``. The preset's steps are
        baked into the server-side preset definition; the request only
        specifies the input + output destination and optional per-step
        param overrides.
      properties:
        file_path: { type: string, nullable: true, description: "Relative path to a staged input. Give either file_path or file_url." }
        file_url: { type: string, format: uri, nullable: true, description: "HTTP(S) address of a remote input. The server's fetch policy applies." }
        output_path: { type: string, nullable: true, description: "Relative staging path where the result should be written." }
        output_url: { type: string, format: uri, nullable: true, description: "HTTP(S) destination that accepts a PUT of the result." }
        output_format: { $ref: "#/components/schemas/OutputFormat" }
        async_job: { type: boolean, default: false, description: "Return a job ID and process the request in the background." }
        webhook_url: { type: string, format: uri, nullable: true, description: "Optional URL that receives a POST when the background job finishes." }
        params:
          type: object
          additionalProperties: true
          nullable: true
          description: Override values for parameters the preset declares.

    PipelineRunRequest:
      type: object
      required: [steps]
      description: |
        Body for ``POST /v1/pipeline``. Apply N transforms in order to
        one input. Intermediates stay in memory between steps — no
        re-upload required.
      properties:
        file_path: { type: string, nullable: true, description: "Relative path to a staged input. Give either file_path or file_url." }
        file_url: { type: string, format: uri, nullable: true, description: "HTTP(S) address of a remote input. The server's fetch policy applies." }
        steps:
          description: "Operations in execution order. Each step uses the previous step's output."
          type: array
          items:
            type: object
            required: [op]
            properties:
              op: { type: string }
              params:
                type: object
                additionalProperties: true
        output_path: { type: string, nullable: true, description: "Relative staging path where the result should be written." }
        output_url: { type: string, format: uri, nullable: true, description: "HTTP(S) destination that accepts a PUT of the result." }
        output_format: { $ref: "#/components/schemas/OutputFormat" }
        async_job: { type: boolean, default: false, description: "Return a job ID and process the request in the background." }
        webhook_url: { type: string, format: uri, nullable: true, description: "Optional URL that receives a POST when the background job finishes." }

    AudioMasterRequest:
      allOf:
        - $ref: "#/components/schemas/BaseAudioInputRequest"
        - $ref: "#/components/schemas/BaseAudioOutputRequest"
        - type: object
          properties:
            mode:
              type: string
              enum: [reference, chain]
              nullable: true
              description: |
                Either `reference` (match against a reference track via
                matchering) or `chain` (run a pedalboard preset chain).
                Optional — auto-detected from the request: if
                reference_path or reference_url is set, mode=reference;
                else if preset is set, mode=chain; else 400.
            reference_path:
              description: "Relative staging path to the track used as the mastering reference."
              type: string
              nullable: true
            reference_url:
              description: "HTTP(S) URL of a mastering reference. The fetch policy applies."
              type: string
              format: uri
              nullable: true
            preset:
              type: string
              nullable: true
              description: |
                For mode=chain, the pedalboard preset to run. Currently
                'transparent' or 'loud'. (Note: this is distinct from the
                workflow presets listed at GET /v1/presets — those are
                multi-step pipelines invoked via POST /v1/presets/{name}.)
            target_lufs:
              description: "Target integrated loudness in LUFS."
              type: number
              nullable: true

    AudioAnalyzeRequest:
      allOf:
        - $ref: "#/components/schemas/BaseAudioInputRequest"
        - type: object
          properties:
            features:
              description: "Measurements to return. Choose bpm, key, loudness, duration, spectral_centroid, rms or zcr. Omit or send an empty list for all measurements."
              type: array
              items:
                type: string
              default: []

    AudioTransformRequest:
      allOf:
        - $ref: "#/components/schemas/BaseAudioInputRequest"
        - $ref: "#/components/schemas/BaseAudioOutputRequest"
        - type: object
          required: [operations]
          properties:
            operations:
              type: array
              description: SoX effect chain — each entry is {op, params}.
              items:
                type: object
                properties:
                  op: { type: string }
                  params: { type: object, additionalProperties: true }

    AudioLoudnessRequest:
      allOf:
        - $ref: "#/components/schemas/BaseAudioInputRequest"

    AudioNormalizeRequest:
      allOf:
        - $ref: "#/components/schemas/BaseAudioInputRequest"
        - $ref: "#/components/schemas/BaseAudioOutputRequest"
        - type: object
          required: [target_lufs]
          properties:
            target_lufs:
              description: "Target integrated loudness in LUFS."
              type: number

    AudioFxRequest:
      allOf:
        - $ref: "#/components/schemas/BaseAudioInputRequest"
        - $ref: "#/components/schemas/BaseAudioOutputRequest"
        - type: object
          required: [effects]
          properties:
            effects:
              type: array
              description: Pedalboard effect chain — each entry is {type, params}.
              items:
                type: object
                properties:
                  type: { type: string }
                  params: { type: object, additionalProperties: true }

    MidiRenderRequest:
      allOf:
        - $ref: "#/components/schemas/BaseAudioInputRequest"
        - $ref: "#/components/schemas/BaseAudioOutputRequest"
        - type: object
          properties:
            soundfont_path:
              description: "Relative path of a staged SoundFont. Omit to use the bundled SoundFont."
              type: string
              nullable: true
            gain:
              description: "FluidSynth output gain."
              type: number
              default: 0.5
            samplerate:
              description: "Sample rate of rendered audio in hertz."
              type: integer
              default: 44100

    AudioBeatsRequest:
      allOf:
        - $ref: "#/components/schemas/BaseAudioInputRequest"
        - $ref: "#/components/schemas/BaseAudioOutputRequest"
        - type: object
          properties:
            click_track:
              description: "Render an audible click on the estimated beat grid."
              type: boolean
              default: false
            start_bpm:
              description: "Initial tempo estimate, in beats per minute, for beat tracking."
              type: number
              nullable: true

    AudioOnsetsRequest:
      allOf:
        - $ref: "#/components/schemas/BaseAudioInputRequest"

    AudioMelodyRequest:
      allOf:
        - $ref: "#/components/schemas/BaseAudioInputRequest"
        - $ref: "#/components/schemas/BaseAudioOutputRequest"
        - type: object
          properties:
            fmin:
              description: "Lowest pitch to track, in hertz."
              type: number
              default: 65.0
            fmax:
              description: "Highest pitch to track, in hertz."
              type: number
              default: 2093.0
            as_midi:
              description: "Export tracked melody notes as MIDI."
              type: boolean
              default: false

    AudioSegmentsRequest:
      allOf:
        - $ref: "#/components/schemas/BaseAudioInputRequest"
        - type: object
          properties:
            num_segments:
              description: "Number of sections to find."
              type: integer
              default: 6

    AudioSilenceRequest:
      allOf:
        - $ref: "#/components/schemas/BaseAudioInputRequest"
        - $ref: "#/components/schemas/BaseAudioOutputRequest"
        - type: object
          properties:
            threshold_db:
              description: "Level threshold in decibels."
              type: number
              default: -30.0
            min_duration_sec:
              description: "Shortest quiet interval to report, in seconds."
              type: number
              default: 0.5
            trim_mode:
              description: "Whether to report silence only, trim the edges or remove all detected silent intervals."
              type: string
              nullable: true

    AudioVisualizeImageSpectrogramRequest:
      allOf:
        - $ref: "#/components/schemas/BaseAudioInputRequest"
        - $ref: "#/components/schemas/BaseAudioOutputRequest"
        - type: object
          properties:
            width:
              description: "Output width in pixels."
              type: integer
              default: 1280
            height:
              description: "Output height in pixels."
              type: integer
              default: 720
            color:
              description: "Color or palette name used for the visualization."
              type: string
              default: intensity
            scale:
              description: "Frequency display scale for the spectrogram."
              type: string
              default: log

    AudioVisualizeImageWaveformRequest:
      allOf:
        - $ref: "#/components/schemas/BaseAudioInputRequest"
        - $ref: "#/components/schemas/BaseAudioOutputRequest"
        - type: object
          properties:
            width:
              description: "Output width in pixels."
              type: integer
              default: 1280
            height:
              description: "Output height in pixels."
              type: integer
              default: 720
            color:
              description: "Color or palette name used for the visualization."
              type: string
              default: lime

    AudioVisualizeVideoRequest:
      allOf:
        - $ref: "#/components/schemas/BaseAudioInputRequest"
        - $ref: "#/components/schemas/BaseAudioOutputRequest"
        - type: object
          properties:
            width:
              description: "Output width in pixels."
              type: integer
              default: 1280
            height:
              description: "Output height in pixels."
              type: integer
              default: 720
            fps:
              description: "Frames per second for the generated video."
              type: integer
              default: 30
            container:
              description: "Container format for the generated video."
              type: string
              default: mp4

    AudioFingerprintRequest:
      allOf:
        - $ref: "#/components/schemas/BaseAudioInputRequest"
        - type: object
          properties:
            analyze_seconds:
              description: "Maximum duration to fingerprint, in seconds."
              type: number
              default: 120.0
            return_raw:
              description: "Return the uncompressed fingerprint representation."
              type: boolean
              default: false

    AudioRestoreRequest:
      allOf:
        - $ref: "#/components/schemas/BaseAudioInputRequest"
        - $ref: "#/components/schemas/BaseAudioOutputRequest"
        - type: object
          properties:
            aggressive:
              description: "Use more aggressive echo removal with the compatible UVR engine."
              type: boolean
              default: false

    MidiInspectRequest:
      allOf:
        - $ref: "#/components/schemas/BaseAudioInputRequest"

    MidiTransformRequest:
      allOf:
        - $ref: "#/components/schemas/BaseAudioInputRequest"
        - $ref: "#/components/schemas/BaseAudioOutputRequest"
        - type: object
          properties:
            transpose_semitones:
              description: "Number of semitones to shift notes. Negative values lower the pitch."
              type: integer
              default: 0
            quantize_grid_beats:
              description: "Grid spacing in beats for snapping note starts."
              type: number
              nullable: true
            tempo_bpm:
              description: "Tempo in beats per minute."
              type: number
              nullable: true
            keep_channels:
              description: "Comma-separated MIDI channels to retain."
              type: string
              nullable: true
            drop_channels:
              description: "Comma-separated MIDI channels to exclude."
              type: string
              nullable: true

    AudioToMidiRequest:
      allOf:
        - $ref: "#/components/schemas/BaseAudioInputRequest"
        - $ref: "#/components/schemas/BaseAudioOutputRequest"
        - type: object
          properties:
            onset_threshold:
              description: "Minimum onset confidence used when detecting notes."
              type: number
              default: 0.5
            frame_threshold:
              description: "Minimum frame confidence used when tracking notes."
              type: number
              default: 0.3
            minimum_note_length_ms:
              description: "Shortest note to keep, in milliseconds."
              type: number
              default: 58.0
            minimum_frequency:
              description: "Lowest note frequency to consider, in hertz."
              type: number
              nullable: true
            maximum_frequency:
              description: "Highest note frequency to consider, in hertz."
              type: number
              nullable: true
            multiple_pitch_bends:
              description: "Allow pitch bends on simultaneous notes."
              type: boolean
              default: false
            melodia_trick:
              description: "Enable Basic Pitch's additional melody inference step."
              type: boolean
              default: true

    AudioEnhanceRequest:
      allOf:
        - $ref: "#/components/schemas/BaseAudioInputRequest"
        - $ref: "#/components/schemas/BaseAudioOutputRequest"

    AudioChordsRequest:
      allOf:
        - $ref: "#/components/schemas/BaseAudioInputRequest"
        - type: object
          properties:
            hop_length:
              description: "Number of samples between analysis frames."
              type: integer
              default: 512
            segment_min_duration_sec:
              description: "Shortest chord segment to retain, in seconds."
              type: number
              default: 0.5

    AudioVadRequest:
      allOf:
        - $ref: "#/components/schemas/BaseAudioInputRequest"
        - type: object
          properties:
            threshold:
              description: "Minimum speech probability for voice activity detection."
              type: number
              default: 0.5
            min_speech_duration_ms:
              description: "Minimum duration of a speech interval, in milliseconds."
              type: number
              default: 250.0
            min_silence_duration_ms:
              description: "Minimum silence required to separate speech intervals, in milliseconds."
              type: number
              default: 100.0

    AudioDiarizeRequest:
      allOf:
        - $ref: "#/components/schemas/BaseAudioInputRequest"
        - type: object
          properties:
            num_speakers:
              description: "Exact number of speakers, if you know it."
              type: integer
              nullable: true
            min_speakers:
              description: "Lower bound on the number of speakers to detect."
              type: integer
              nullable: true
            max_speakers:
              description: "Upper bound on the number of speakers to detect."
              type: integer
              nullable: true

    AudioStretchRequest:
      allOf:
        - $ref: "#/components/schemas/BaseAudioInputRequest"
        - $ref: "#/components/schemas/BaseAudioOutputRequest"
        - type: object
          properties:
            tempo_factor:
              description: "Playback speed multiplier without changing pitch. A value of 0.5 halves the speed."
              type: number
              default: 1.0
            pitch_semitones:
              description: "Pitch shift in semitones. Positive values raise the pitch."
              type: number
              default: 0.0

    AudioTagRequest:
      allOf:
        - $ref: "#/components/schemas/BaseAudioInputRequest"
        - type: object
          properties:
            top_k:
              description: "Maximum number of ranked labels to return."
              type: integer
              default: 10

    AudioEmbedRequest:
      allOf:
        - $ref: "#/components/schemas/BaseAudioInputRequest"
        - type: object
          properties:
            query_text:
              description: "Text to compare with the audio embedding."
              type: string
              nullable: true

    AudioSeparateHpssRequest:
      allOf:
        - $ref: "#/components/schemas/BaseAudioInputRequest"
        - $ref: "#/components/schemas/BaseAudioOutputRequest"
        - type: object
          properties:
            margin:
              description: "Separation margin. Values above one make the separation stricter."
              type: number
              default: 1.0
            kernel_size:
              description: "Size of the median filter used to separate tonal and percussive content."
              type: integer
              default: 31

    AudioNoiseReduceRequest:
      allOf:
        - $ref: "#/components/schemas/BaseAudioInputRequest"
        - $ref: "#/components/schemas/BaseAudioOutputRequest"
        - type: object
          properties:
            stationary:
              description: "Treat the noise as steady across the recording."
              type: boolean
              default: false
            prop_decrease:
              description: "Fraction of estimated background noise to remove."
              type: number
              default: 1.0

    AudioInfoRequest:
      allOf:
        - $ref: "#/components/schemas/BaseAudioInputRequest"

    AudioTrimRequest:
      allOf:
        - $ref: "#/components/schemas/BaseAudioInputRequest"
        - $ref: "#/components/schemas/BaseAudioOutputRequest"
        - type: object
          properties:
            start_sec:
              type: number
              default: 0.0
              description: "Trim window start in seconds. Defaults to 0 (beginning of file)."
            end_sec:
              type: number
              nullable: true
              description: "Trim window end in seconds. Omit (or pass null) to trim to end of source."

    AudioMixRequest:
      allOf:
        - $ref: "#/components/schemas/MultiAudioInputRequest"
        - $ref: "#/components/schemas/BaseAudioOutputRequest"

    AudioConcatRequest:
      allOf:
        - $ref: "#/components/schemas/MultiAudioInputRequest"
        - $ref: "#/components/schemas/BaseAudioOutputRequest"

    AudioSpeedRequest:
      allOf:
        - $ref: "#/components/schemas/BaseAudioInputRequest"
        - $ref: "#/components/schemas/BaseAudioOutputRequest"
        - type: object
          required: [speed]
          properties:
            speed:
              description: "Playback speed multiplier. A value of 1 keeps the original rate."
              type: number

    AudioConvertRequest:
      allOf:
        - $ref: "#/components/schemas/BaseAudioInputRequest"
        - $ref: "#/components/schemas/BaseAudioOutputRequest"
        - type: object
          properties:
            sample_rate:
              description: "Output sample rate in hertz."
              type: integer
              nullable: true
            channels:
              description: "Number of output audio channels."
              type: integer
              nullable: true

    AudioSimilarRequest:
      allOf:
        - $ref: "#/components/schemas/BaseAudioInputRequest"
        - type: object
          properties:
            reference_file_path:
              type: string
              nullable: true
              description: |
                Reference (second) file to compare against. Also
                accepted as `file_path_b` for the "compare two files"
                shape that's intuitive when the API is read out of
                context.
            reference_file_url:
              type: string
              nullable: true
              description: |
                Same as reference_file_path but for an HTTP URL the
                server fetches (subject to AUDIOLLA_FETCH_MODE policy).
                Also accepted as `file_url_b`.
            file_path_b:
              type: string
              nullable: true
              description: Alias for reference_file_path.
            file_url_b:
              type: string
              nullable: true
              description: Alias for reference_file_url.

    MidiQuantizeRequest:
      allOf:
        - $ref: "#/components/schemas/BaseAudioInputRequest"
        - $ref: "#/components/schemas/BaseAudioOutputRequest"
        - type: object
          properties:
            grid_beats:
              description: "Grid spacing in beats. A value of 0.25 is a sixteenth note in 4/4."
              type: number
              default: 0.25

    AudioClassifyRequest:
      allOf:
        - $ref: "#/components/schemas/BaseAudioInputRequest"
        - type: object
          required: [labels]
          properties:
            labels:
              type: array
              description: Candidate label strings to score the audio against.
              items: { type: string }

    AudioFadeRequest:
      allOf:
        - $ref: "#/components/schemas/BaseAudioInputRequest"
        - $ref: "#/components/schemas/BaseAudioOutputRequest"
        - type: object
          properties:
            fade_in:
              type: number
              default: 0.0
              description: |
                Fade-in length in seconds (0 disables). Also accepted as
                `fade_in_sec` — the `_sec` suffix matches the rest of
                the API (`start_sec`, `end_sec`, etc.).
            fade_in_sec:
              type: number
              nullable: true
              description: Alias for fade_in. Wins if both are set.
            fade_out:
              type: number
              default: 0.0
              description: |
                Fade-out length in seconds (0 disables). Also accepted
                as `fade_out_sec`.
            fade_out_sec:
              type: number
              nullable: true
              description: Alias for fade_out. Wins if both are set.
            curve:
              description: "Fade curve that controls how gain changes during the fade."
              type: string
              default: tri

    AudioReverseRequest:
      allOf:
        - $ref: "#/components/schemas/BaseAudioInputRequest"
        - $ref: "#/components/schemas/BaseAudioOutputRequest"

    AudioLoopRequest:
      allOf:
        - $ref: "#/components/schemas/BaseAudioInputRequest"
        - $ref: "#/components/schemas/BaseAudioOutputRequest"
        - type: object
          properties:
            count:
              description: "Number of times to play the source in the resulting file."
              type: integer
              default: 2

    AudioBpmMatchRequest:
      allOf:
        - $ref: "#/components/schemas/BaseAudioInputRequest"
        - $ref: "#/components/schemas/BaseAudioOutputRequest"
        - type: object
          required: [target_bpm]
          properties:
            target_bpm:
              description: "Desired tempo in beats per minute."
              type: number
            pitch_semitones:
              description: "Pitch shift in semitones. Positive values raise the pitch."
              type: number
              default: 0.0

    AudioStereoWidthRequest:
      allOf:
        - $ref: "#/components/schemas/BaseAudioInputRequest"
        - $ref: "#/components/schemas/BaseAudioOutputRequest"
        - type: object
          properties:
            width:
              description: "Stereo width multiplier. Zero is mono and one keeps the original width."
              type: number
              default: 1.0

    AudioSplitRequest:
      allOf:
        - $ref: "#/components/schemas/BaseAudioInputRequest"
        - $ref: "#/components/schemas/BaseAudioOutputRequest"
        - type: object
          properties:
            mode:
              description: "Use equal for a fixed number of pieces or silence to cut at quiet intervals."
              type: string
              enum: [equal, silence]
              default: equal
            count:
              description: "Number of pieces in equal-length mode."
              type: integer
              nullable: true
            threshold_db:
              description: "Level threshold in decibels."
              type: number
              default: -30.0
            min_duration_sec:
              description: "Minimum quiet interval used as a split point, in seconds."
              type: number
              default: 0.5

    AudioPanRequest:
      allOf:
        - $ref: "#/components/schemas/BaseAudioInputRequest"
        - $ref: "#/components/schemas/BaseAudioOutputRequest"
        - type: object
          properties:
            position:
              description: "Stereo placement from -1 at the left through 0 at center to 1 at the right."
              type: number
              default: 0.0

    AudioEqRequest:
      allOf:
        - $ref: "#/components/schemas/BaseAudioInputRequest"
        - $ref: "#/components/schemas/BaseAudioOutputRequest"
        - type: object
          required: [bands]
          properties:
            bands:
              type: array
              description: Array of band specifications (object per band).
              items: { type: object, additionalProperties: true }

    AudioKeyMatchRequest:
      allOf:
        - $ref: "#/components/schemas/BaseAudioInputRequest"
        - $ref: "#/components/schemas/BaseAudioOutputRequest"
        - type: object
          required: [target_key]
          properties:
            target_key:
              description: "Target root note, such as C or F#."
              type: string

    AudioSidechainDuckRequest:
      allOf:
        - $ref: "#/components/schemas/BaseAudioInputRequest"
        - $ref: "#/components/schemas/BaseAudioOutputRequest"
        - type: object
          properties:
            trigger_file_path:
              description: "Relative staging path of the audio that triggers gain reduction."
              type: string
              nullable: true
            trigger_file_url:
              description: "HTTP(S) URL of the audio that triggers gain reduction."
              type: string
              nullable: true
            threshold_db:
              description: "Level threshold in decibels."
              type: number
              default: -20.0
            ratio:
              description: "Compression ratio above the threshold."
              type: number
              default: 4.0
            attack_ms:
              description: "Time in milliseconds for gain reduction to engage."
              type: number
              default: 10.0
            release_ms:
              description: "Time in milliseconds for gain to recover."
              type: number
              default: 200.0

    AudioMetadataRequest:
      allOf:
        - $ref: "#/components/schemas/BaseAudioInputRequest"
        - $ref: "#/components/schemas/BaseAudioOutputRequest"
        - type: object
          properties:
            tags:
              type: string
              nullable: true
              description: |
                JSON-encoded tag dict to write. Omit / null = read-only
                mode (returns the file's current tags). When supplied,
                the handler writes the tags into the audio file's
                container and — if ``output_path`` or ``output_url`` is
                also set — persists the tagged audio there. Without
                an output target, write-mode is no-op-persistent (tags
                applied to bytes in memory; updated tag set returned
                in the response; no file landed).

    AudioClipDetectRequest:
      allOf:
        - $ref: "#/components/schemas/BaseAudioInputRequest"

    AudioMidSideRequest:
      allOf:
        - $ref: "#/components/schemas/BaseAudioInputRequest"
        - $ref: "#/components/schemas/BaseAudioOutputRequest"
        - type: object
          required: [mode]
          properties:
            mode:
              description: "Use encode for stereo to mid-side, or decode for mid-side to stereo."
              type: string
              enum: [encode, decode]

    AudioBeatSliceRequest:
      allOf:
        - $ref: "#/components/schemas/BaseAudioInputRequest"
        - $ref: "#/components/schemas/BaseAudioOutputRequest"

    AudioConvReverbRequest:
      allOf:
        - $ref: "#/components/schemas/BaseAudioInputRequest"
        - $ref: "#/components/schemas/BaseAudioOutputRequest"
        - type: object
          properties:
            ir_file_path:
              description: "Relative staging path of the impulse response."
              type: string
              nullable: true
            ir_file_url:
              description: "HTTP(S) URL of the impulse response."
              type: string
              nullable: true
            wet_mix:
              description: "Fraction of the reverberated signal in the result. Zero is dry and one is fully wet."
              type: number
              default: 0.3

    AudioTransientRequest:
      allOf:
        - $ref: "#/components/schemas/BaseAudioInputRequest"
        - $ref: "#/components/schemas/BaseAudioOutputRequest"
        - type: object
          properties:
            attack_gain_db:
              description: "Gain change in decibels applied to transient attacks."
              type: number
              default: 0.0
            sustain_gain_db:
              description: "Gain change in decibels applied to sustain."
              type: number
              default: 0.0

    AudioMultibandCompressRequest:
      allOf:
        - $ref: "#/components/schemas/BaseAudioInputRequest"
        - $ref: "#/components/schemas/BaseAudioOutputRequest"
        - type: object
          required: [bands, crossovers_hz]
          properties:
            crossovers_hz:
              type: array
              description: Ascending crossover frequencies (Hz). 1 fewer than the number of bands.
              items: { type: number }
            bands:
              type: array
              description: Array of band specifications (object per band).
              items: { type: object, additionalProperties: true }

    AudioRemixRequest:
      allOf:
        - $ref: "#/components/schemas/BaseAudioInputRequest"
        - $ref: "#/components/schemas/BaseAudioOutputRequest"
        - type: object
          properties:
            engine:
              type: string
              default: htdemucs
              description: Stem-separation engine for the unmix step.
            stem_mix:
              type: object
              additionalProperties:
                type: number
              description: |
                Per-stem gain dict — keys are stem names ('vocals', 'drums',
                'bass', 'other'), values are linear gain multipliers (1.0 =
                keep, 0.0 = mute, 0.5 = -6 dB). Missing stems default to 1.0.

    AudioDjPrepRequest:
      allOf:
        - $ref: "#/components/schemas/BaseAudioInputRequest"

    AudioLoudnessCurveRequest:
      allOf:
        - $ref: "#/components/schemas/BaseAudioInputRequest"
        - type: object
          properties:
            hop_length:
              description: "Number of samples between analysis frames."
              type: integer
              default: 512

    AudioPitchCorrectRequest:
      allOf:
        - $ref: "#/components/schemas/BaseAudioInputRequest"
        - $ref: "#/components/schemas/BaseAudioOutputRequest"
        - type: object
          properties:
            strength:
              description: "Correction strength. Zero bypasses the correction and one applies the full estimated shift."
              type: number
              default: 1.0

    AudioRepairRequest:
      allOf:
        - $ref: "#/components/schemas/BaseAudioInputRequest"
        - $ref: "#/components/schemas/BaseAudioOutputRequest"
        - type: object
          properties:
            declip:
              description: "Interpolate clipped samples."
              type: boolean
              default: true
            dehum:
              description: "Remove mains hum around the specified frequency."
              type: boolean
              default: false
            hum_freq:
              description: "Fundamental hum frequency in hertz, typically 50 or 60."
              type: number
              default: 50.0

    AudioLoopPointRequest:
      allOf:
        - $ref: "#/components/schemas/BaseAudioInputRequest"
        - type: object
          properties:
            min_loop_bars:
              description: "Minimum loop length in bars."
              type: integer
              default: 4
            num_candidates:
              description: "Maximum number of alternate loop candidates to return."
              type: integer
              default: 5

    AudioChordsToMidiRequest:
      allOf:
        - $ref: "#/components/schemas/BaseAudioInputRequest"
        - $ref: "#/components/schemas/BaseAudioOutputRequest"
        - type: object
          properties:
            tempo_bpm:
              description: "Tempo in beats per minute."
              type: number
              nullable: true
            velocity:
              description: "MIDI note-on velocity for generated chord notes."
              type: integer
              default: 80
            octave:
              description: "MIDI octave used when voicing detected chords."
              type: integer
              default: 4

    AudioDeessRequest:
      allOf:
        - $ref: "#/components/schemas/BaseAudioInputRequest"
        - $ref: "#/components/schemas/BaseAudioOutputRequest"
        - type: object
          properties:
            threshold_db:
              description: "Level threshold in decibels."
              type: number
              default: -20.0
            frequency_hz:
              description: "Cutoff in hertz for the band containing sibilance."
              type: number
              default: 6000.0
            ratio:
              description: "Compression ratio above the threshold."
              type: number
              default: 4.0

    AudioStereoFieldRequest:
      allOf:
        - $ref: "#/components/schemas/BaseAudioInputRequest"

    AudioThumbnailRequest:
      allOf:
        - $ref: "#/components/schemas/BaseAudioInputRequest"
        - $ref: "#/components/schemas/BaseAudioOutputRequest"
        - type: object
          properties:
            duration_sec:
              description: "Length of the preview clip in seconds."
              type: number
              default: 30.0

    MidiHumanizeRequest:
      allOf:
        - $ref: "#/components/schemas/BaseAudioInputRequest"
        - $ref: "#/components/schemas/BaseAudioOutputRequest"
        - type: object
          properties:
            timing_ms:
              description: "Maximum timing variation in milliseconds in either direction."
              type: number
              default: 10.0
            velocity_pct:
              description: "Maximum velocity variation as a percentage of the MIDI velocity range."
              type: number
              default: 10.0
            seed:
              description: "Seed for repeatable timing and velocity variations."
              type: integer
              nullable: true

    # ── dedicated generate engines (manual) ──
    StableAudioOpenRequest:
      allOf:
        - $ref: "#/components/schemas/BaseGenerateRequest"
        - $ref: "#/components/schemas/BaseAudioOutputRequest"
        - type: object
          properties:
            num_inference_steps: { type: integer, minimum: 1, maximum: 500, default: 100, description: "Number of inference steps to run." }
            negative_prompt: { type: string, default: 'low quality, average quality', description: "Text describing sounds or qualities to avoid." }

    MusicGenRequest:
      allOf:
        - $ref: "#/components/schemas/BaseGenerateRequest"
        - $ref: "#/components/schemas/BaseAudioOutputRequest"
        - type: object
          properties:
            lyrics:
              type: string
              nullable: true
              description: Accepted for API uniformity; MusicGen is instrumental-only.

    RiffusionRequest:
      allOf:
        - $ref: "#/components/schemas/BaseGenerateRequest"
        - $ref: "#/components/schemas/BaseAudioOutputRequest"
        - type: object

    AudioLDM2Request:
      allOf:
        - $ref: "#/components/schemas/BaseGenerateRequest"
        - $ref: "#/components/schemas/BaseAudioOutputRequest"
        - type: object
          properties:
            num_inference_steps: { type: integer, minimum: 1, maximum: 500, default: 200, description: "Number of inference steps to run." }
            negative_prompt: { type: string, default: 'Low quality.', description: "Text describing sounds or qualities to avoid." }

paths:
  /healthz:
    get:
      tags:
        - "Health"
      summary: "Check service health"
      operationId: healthz
      description: "Check that the server is responding and see its device and configured engines. This route is public even when bearer authentication is enabled."
      security: []
      responses:
        "200":
          description: Service is up.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthResponse" }

  /v1/audio/separate:
    post:
      tags:
        - "Audio Separation"
      summary: "Separate a mix into stems"
      operationId: separate
      description: "Isolate vocals, drums, bass or other parts with a configured separation engine. Send one input and an output destination for a synchronous request. One requested stem produces an audio file. Several stems, or the default request for all stems, produce a ZIP."
      requestBody:
        description: Choose the source, engine, stems and output destination.
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AudioSeparateRequest" }
            examples:
              vocals:
                summary: Extract vocals from a staged mix
                value:
                  file_path: uploads/song.wav
                  engine: htdemucs
                  stems: [vocals]
                  output_format: wav
                  output_path: out/vocals.wav
              allStems:
                summary: Save every stem in a ZIP
                value:
                  file_path: uploads/song.wav
                  engine: htdemucs
                  output_format: wav
                  output_path: out/stems.zip
      responses:
        "200":
          description: Output file descriptor. One stem is returned as audio. Multiple stems are saved as a ZIP.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/StagedOutputResponse"
                  - $ref: "#/components/schemas/UrlOutputResponse"
        "202":
          description: Background separation accepted. Poll the job URL for the result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobAcceptedResponse" }
        "400": { $ref: "#/components/responses/400" }
        "401": { $ref: "#/components/responses/401" }
        "404": { $ref: "#/components/responses/404" }
        "413": { $ref: "#/components/responses/413" }
        "415": { $ref: "#/components/responses/415" }
        "422": { $ref: "#/components/responses/422" }
        "500": { $ref: "#/components/responses/500" }

  /v1/audio/master:
    post:
      tags:
        - "Audio Restoration"
      summary: "Master an audio track"
      operationId: master
      description: "Use a reference track to match its tonal balance and loudness, or apply a built-in mastering preset without a reference. The server infers the mode from the supplied reference or preset when you omit the mode."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AudioMasterRequest" }
            example:
              file_path: uploads/song.wav
              output_path: out/master.wav
              mode: reference
              reference_path: uploads/reference.wav
      responses:
        "200":
          description: Audio produced.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/StagedOutputResponse"
                  - $ref: "#/components/schemas/UrlOutputResponse"
        "202":
          description: Async job accepted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobAcceptedResponse" }
        "400": { $ref: "#/components/responses/400" }
        "401": { $ref: "#/components/responses/401" }
        "404": { $ref: "#/components/responses/404" }
        "413": { $ref: "#/components/responses/413" }
        "415": { $ref: "#/components/responses/415" }
        "422": { $ref: "#/components/responses/422" }
        "500": { $ref: "#/components/responses/500" }

  /v1/audio/analyze:
    post:
      tags:
        - "Audio Analysis"
      summary: "Analyze an audio track"
      operationId: analyze
      description: "Measure tempo, key, loudness and optional audio features from one recording. The JSON fields depend on the requested features and may be null when a measurement cannot be calculated."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AudioAnalyzeRequest" }
            example:
              file_path: uploads/song.wav
      responses:
        "200":
          description: JSON result.
          content:
            application/json:
              schema: { type: object }
        "202":
          description: Async job accepted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobAcceptedResponse" }
        "400": { $ref: "#/components/responses/400" }
        "401": { $ref: "#/components/responses/401" }
        "404": { $ref: "#/components/responses/404" }
        "413": { $ref: "#/components/responses/413" }
        "415": { $ref: "#/components/responses/415" }
        "422": { $ref: "#/components/responses/422" }
        "500": { $ref: "#/components/responses/500" }

  /v1/audio/transform:
    post:
      tags:
        - "Audio Transform"
      summary: "Run SoX audio transforms"
      operationId: transform
      description: "Apply the listed effects in order to one input. Each step names a SoX operation and supplies its parameters."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AudioTransformRequest" }
            example:
              file_path: uploads/song.wav
              output_path: out/sox.wav
              operations:
              - op: gain
                params:
                  db: -3
      responses:
        "200":
          description: Audio produced.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/StagedOutputResponse"
                  - $ref: "#/components/schemas/UrlOutputResponse"
        "202":
          description: Async job accepted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobAcceptedResponse" }
        "400": { $ref: "#/components/responses/400" }
        "401": { $ref: "#/components/responses/401" }
        "404": { $ref: "#/components/responses/404" }
        "413": { $ref: "#/components/responses/413" }
        "415": { $ref: "#/components/responses/415" }
        "422": { $ref: "#/components/responses/422" }
        "500": { $ref: "#/components/responses/500" }

  /v1/audio/loudness:
    post:
      tags:
        - "Audio Analysis"
      summary: "Measure integrated loudness"
      operationId: loudness
      description: "Report integrated loudness in LUFS. Use the normalization operation to apply a gain change to the file."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AudioLoudnessRequest" }
            example:
              file_path: uploads/song.wav
      responses:
        "200":
          description: JSON result.
          content:
            application/json:
              schema: { type: object }
        "202":
          description: Async job accepted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobAcceptedResponse" }
        "400": { $ref: "#/components/responses/400" }
        "401": { $ref: "#/components/responses/401" }
        "404": { $ref: "#/components/responses/404" }
        "413": { $ref: "#/components/responses/413" }
        "415": { $ref: "#/components/responses/415" }
        "422": { $ref: "#/components/responses/422" }
        "500": { $ref: "#/components/responses/500" }

  /v1/audio/normalize:
    post:
      tags:
        - "Audio Transform"
      summary: "Normalize integrated loudness"
      operationId: normalize
      description: "Apply gain to bring an audio file to the target integrated loudness in LUFS. This writes a new file."
      requestBody:
        required: true
        content:
          application/json:
